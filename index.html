function updateAll(){
  // overhead total
  document.getElementById('out-overhead-total').textContent = gbp(overheadTotal(),2);

  const results = {};
  products.forEach(p=>{ results[p.key] = computeProduct(p); });

  // line-level remaining, computed once, used on every product screen and cross-check
  const lineRemaining = {};
  const dashAttn = [];
  OVERHEAD_LINES.forEach(l=>{
    const total = parseFloat(overhead[l.key])||0;
    let allocated = 0;
    products.forEach(p=>{ allocated += results[p.key].allocated[l.key]; });
    lineRemaining[l.key] = total - allocated;
  });

  products.forEach(p=>{
    const r = results[p.key];
    OVERHEAD_LINES.forEach(l=>{
      const pctInput = document.getElementById(`input-alloc-${p.key}-${l.key}`);
      const amtInput = document.getElementById(`input-allocamt-${p.key}-${l.key}`);
      const pctVal = parseFloat(p.allocations[l.key])||0;
      const amtVal = r.allocated[l.key];
      if(pctInput && document.activeElement !== pctInput){
        pctInput.value = Math.round(pctVal*10000)/10000;
      }
      if(amtInput && document.activeElement !== amtInput){
        amtInput.value = Math.round(amtVal*100)/100;
      }
      const leftEl = document.getElementById(`out-left-${p.key}-${l.key}`);
      if(leftEl){
        const rem = lineRemaining[l.key];
        let color = 'var(--ink)';
        if(Math.abs(rem) < 0.5) color = 'var(--green)';
        else if(rem < -0.5) color = 'var(--red)';
        else color = 'var(--amber)';
        leftEl.style.color = color;
        leftEl.style.fontWeight = '700';
        leftEl.textContent = gbp(rem,2);
      }
      const chipVal = document.getElementById(`out-top-left-${p.key}-${l.key}`);
      const chipEl = document.getElementById(`chip-${p.key}-${l.key}`);
      if(chipVal){
        const rem = lineRemaining[l.key];
        chipVal.textContent = gbp(rem,2);
        let bg = 'var(--blush2)', fg = 'var(--ink)';
        if(Math.abs(rem) < 0.5){ bg = 'var(--green-bg)'; fg = 'var(--green)'; }
        else if(rem < -0.5){ bg = 'var(--red-bg)'; fg = 'var(--red)'; }
        else { bg = 'var(--amber-bg)'; fg = 'var(--amber)'; }
        if(chipEl) chipEl.style.background = bg;
        chipVal.style.color = fg;
      }
    });
    // hide the strip entirely when every line is fully allocated — it only appears when there's something to fix
    const _strip = document.getElementById('budgetstrip-'+p.key);
    if(_strip){
      const _anyLeft = OVERHEAD_LINES.some(l=>Math.abs(lineRemaining[l.key])>=0.5);
      _strip.style.display = _anyLeft? '' : 'none';
    }
    setText(`out-${p.key}-totalalloc`, gbp(r.totalAllocated,2));
    setText(`out-${p.key}-direct`, r.directPerUnit!==null? gbp(r.directPerUnit,0): '—');
    setText(`out-${p.key}-direct-exact`, r.directPerUnit!==null? '('+gbp(r.directPerUnit,2)+' exact)':'');
    setText(`out-${p.key}-overhead`, r.overheadPerUnit!==null? gbp(r.overheadPerUnit,0):'—');
    setText(`out-${p.key}-overhead-exact`, r.overheadPerUnit!==null? '('+gbp(r.overheadPerUnit,2)+' exact)':'');
    setText(`out-${p.key}-floor`, r.costFloor!==null? gbp(r.costFloor,0):'—');
    setText(`out-${p.key}-floor-exact`, r.costFloor!==null? '('+gbp(r.costFloor,2)+' exact)':'');
    setText(`out-${p.key}-contribution`, r.contributionNI!==null? gbp(r.contributionNI,2):'—');
    setText(`out-${p.key}-breakeven`, r.breakEvenNI!==null? num(r.breakEvenNI,0)+' '+p.unitPlural : '—');
    setText(`out-${p.key}-profittarget`, r.profitTargetSalesNI!==null? num(r.profitTargetSalesNI,0)+' '+p.unitPlural : '—');

    // surplus note
    const surplusEl = document.getElementById(`out-${p.key}-surplusnote`);
    if(surplusEl){
      if(r.surplusNI!==null){
        if(r.surplusNI>=0){
          surplusEl.innerHTML = `<span class="badge ok">On ${r.units} ${p.unitPlural}/yr, that's ${num(r.surplusNI,0)} above break-even</span>`;
        } else {
          surplusEl.innerHTML = `<span class="badge bad">On ${r.units} ${p.unitPlural}/yr, that's ${num(Math.abs(r.surplusNI),0)} short of break-even</span>`;
        }
      } else if(r.contributionNI!==null && r.contributionNI<=0){
        surplusEl.innerHTML = `<span class="badge bad">This price loses money on every sale — contribution is ${gbp(r.contributionNI,2)}</span>`;
      } else {
        surplusEl.innerHTML = '';
      }
    }

    // gauge
    const track = document.getElementById('gauge-track-'+p.key);
    const fill = document.getElementById('gauge-fill-'+p.key);
    const tick = document.getElementById('gauge-tick-'+p.key);
    const ticklabel = document.getElementById('gauge-floorlabel-'+p.key);
    const badge = document.getElementById('gauge-badge-'+p.key);
    if(track && r.costFloor!==null){
      const floor = r.costFloor;
      const price = r.priceNI!==null? r.priceNI : 0;
      const scale = Math.max(floor, price, 1) * 1.25;
      const floorPct = Math.min(100, floor/scale*100);
      const pricePct = Math.min(100, price/scale*100);
      tick.style.left = floorPct+'%';
      ticklabel.style.left = floorPct+'%';
      ticklabel.textContent = 'floor '+gbp(floor,0);
      fill.style.width = pricePct+'%';
      if(r.priceNI===null){
        fill.className = 'gauge-fill';
        fill.style.background = 'var(--ink-soft)';
        fill.innerHTML = '';
      } else if(r.gapNI>=0){
        fill.className = 'gauge-fill ok';
        fill.innerHTML = `<span class="gauge-price-label">€${num(price,0)}</span>`;
        badge.innerHTML = `<span class="badge ok">Above floor by ${gbp(r.gapNI,2)}</span>`;
      } else {
        fill.className = 'gauge-fill bad';
        fill.innerHTML = `<span class="gauge-price-label">€${num(price,0)}</span>`;
        badge.innerHTML = `<span class="badge bad">Below floor by ${gbp(Math.abs(r.gapNI),2)}</span>`;
      }
      if(r.priceNI===null) badge.innerHTML = '';
    } else if(track){
      fill.style.width='0%'; tick.style.left='0%'; ticklabel.textContent=''; badge.innerHTML='';
    }

    // NI
    setText(`out-${p.key}-roi-contribution`, r.contributionROI!==null? eur(r.contributionROI,2):'—');
    setText(`out-${p.key}-roi-breakeven`, r.breakEvenROI!==null? num(r.breakEvenROI,0)+' '+p.unitPlural:'—');

    // capacity threshold warning
    const threshEl = document.getElementById(`out-${p.key}-thresholdwarning`);
    if(threshEl){
      threshEl.innerHTML = r.thresholdCrossed
        ? `<span class="badge warn">Threshold crossed at ${num(r.capacityThreshold,0)} ${p.unitPlural}/yr — +${gbp(r.stepCost,2)} included in break-even below</span>`
        : (r.capacityThreshold>0? `<span class="badge ok">Under threshold (${num(r.capacityThreshold,0)} ${p.unitPlural}/yr) — step cost not yet included</span>` : '');
    }

    // sensitivity — overhead flexed, price & units held at current
    SENS_PCTS.forEach((pct,i)=>{
      const sc = scenarioCalc(r, {overhead: r.effectiveOverheadAnnual*(1+pct/100)});
      setText(`sens-${p.key}-oh-${i}-overhead`, sc? gbp(sc.overhead,2):'—');
      setText(`sens-${p.key}-oh-${i}-breakeven`, sc && sc.breakEven!==null? num(sc.breakEven,0):'—');
      setText(`sens-${p.key}-oh-${i}-surplus`, sc && sc.surplus!==null? (sc.surplus>=0?'+':'')+num(sc.surplus,0):'—');
    });

    // sensitivity — price flexed, overhead & units held at current
    SENS_PCTS.forEach((pct,i)=>{
      const flexedPrice = r.priceNI!==null? r.priceNI*(1+pct/100) : null;
      const sc = flexedPrice!==null? scenarioCalc(r, {price: flexedPrice}) : null;
      setText(`sens-${p.key}-pr-${i}-price`, flexedPrice!==null? gbp(flexedPrice,2):'—');
      setText(`sens-${p.key}-pr-${i}-contribution`, sc? gbp(sc.contribution,2):'—');
      setText(`sens-${p.key}-pr-${i}-breakeven`, sc && sc.breakEven!==null? num(sc.breakEven,0):'—');
      setText(`sens-${p.key}-pr-${i}-surplus`, sc && sc.surplus!==null? (sc.surplus>=0?'+':'')+num(sc.surplus,0):'—');
    });

    // sensitivity — volume flexed, price held at current; overhead steps up if the flex crosses capacity
    SENS_PCTS.forEach((pct,i)=>{
      const flexedUnits = r.units>0? r.units*(1+pct/100) : 0;
      const crossesThreshold = r.capacityThreshold>0 && flexedUnits>r.capacityThreshold;
      const overheadForRow = r.overheadAnnual + (crossesThreshold? r.stepCost : 0);
      const sc = r.units>0? scenarioCalc(r, {units: flexedUnits, overhead: overheadForRow}) : null;
      const vsOverhead = sc && sc.annualContribution!==null? sc.annualContribution - overheadForRow : null;
      setText(`sens-${p.key}-vol-${i}-units`, r.units>0? num(flexedUnits,0):'—');
      setText(`sens-${p.key}-vol-${i}-contribution`, sc && sc.annualContribution!==null? gbp(sc.annualContribution,2):'—');
      const vsEl = document.getElementById(`sens-${p.key}-vol-${i}-surplus`);
      if(vsEl){
        if(vsOverhead===null){ vsEl.textContent = '—'; }
        else {
          vsEl.textContent = (vsOverhead>=0?'+':'')+gbp(vsOverhead,2) + (crossesThreshold? ' (threshold crossed)':'');
          vsEl.style.color = vsOverhead>=0? 'var(--green)':'var(--red)';
        }
      }
    });

    // price scenario comparison — current vs her own alternative-volume estimate
    setText(`scn-${p.key}-cur-price`, r.priceNI!==null? gbp(r.priceNI,2):'—');
    setText(`scn-${p.key}-cur-contribution`, r.contributionNI!==null? gbp(r.contributionNI,2):'—');
    setText(`scn-${p.key}-cur-units`, r.units>0? num(r.units,0):'—');
    const curAnnual = (r.contributionNI!==null && r.units>0) ? r.contributionNI*r.units : null;
    setText(`scn-${p.key}-cur-annual`, curAnnual!==null? gbp(curAnnual,2):'—');
    const curVsEl = document.getElementById(`scn-${p.key}-cur-vs`);
    if(curVsEl){
      if(curAnnual===null){ curVsEl.textContent = '—'; }
      else {
        const diff = curAnnual - r.effectiveOverheadAnnual;
        curVsEl.textContent = (diff>=0?'+':'')+gbp(diff,2);
        curVsEl.style.color = diff>=0? 'var(--green)':'var(--red)';
      }
    }
    setText(`scn-${p.key}-alt-price`, r.altPrice!==null? gbp(r.altPrice,2):'—');
    setText(`scn-${p.key}-alt-contribution`, r.altContribution!==null? gbp(r.altContribution,2):'—');
    setText(`scn-${p.key}-alt-units`, r.altVolume!==null? num(r.altVolume,0):'—');
    setText(`scn-${p.key}-alt-annual`, r.altAnnualContribution!==null? gbp(r.altAnnualContribution,2):'—');
    const altVsEl = document.getElementById(`scn-${p.key}-alt-vs`);
    if(altVsEl){
      if(r.altAnnualContribution===null){ altVsEl.textContent = '—'; }
      else {
        const diff = r.altAnnualContribution - r.effectiveOverheadAnnual;
        altVsEl.textContent = (diff>=0?'+':'')+gbp(diff,2);
        altVsEl.style.color = diff>=0? 'var(--green)':'var(--red)';
      }
    }
  });

  // Step C reference column — brings together Part 2 (floor/price), Step A (going rate), Step B (value prop)
  FINAL_PRICING_ROWS.forEach(r=>{
    const el = document.getElementById('ref-'+r.key);
    if(!el) return;
    const rr = results[r.refProduct];
    let lines = [];
    lines.push(r.roi
      ? `NI price ${rr.roiPrice!==null? eur(rr.roiPrice,2):'—'}`
      : `Floor ${gbp(rr.costFloor,2)} · Price ${gbp(rr.priceNI,2)}`);
    if(r.roi && findProduct(r.refProduct).roiNote){
      lines.push(`<span style="color:var(--amber); font-weight:700;">${findProduct(r.refProduct).roiNote}</span>`);
    }
    if(r.refProduct && r.mkt && competitorData[r.refProduct]){
      const gr = competitorData[r.refProduct][r.mkt].goingRate;
      lines.push(`Going rate (${mktLabel(r.mkt)}): ${gr||'—'}`);
    }
    if(r.cat){
      const vp = marketValueData[r.cat].valueProp;
      lines.push(vp && vp.trim()? '<span style="color:var(--green); font-weight:700;">Value prop written</span>' : '<span style="color:var(--amber); font-weight:700;">Value prop not yet</span>');
    }
    el.innerHTML = lines.join('<br>');

    // outcome at the chosen final price
    const outEl = document.getElementById('outcome-'+r.key);
    if(outEl){
      const rawPrice = finalPricingData[r.key].price;
      const finalPrice = rawPrice? parseFloat(String(rawPrice).replace(/[^0-9.\-]/g,'')) : NaN;
      const curr = r.roi? '£' : '€';
      if(!rawPrice || isNaN(finalPrice)){
        outEl.innerHTML = '<span style="color:var(--ink-soft);">Enter a final price to see the outcome</span>';
      } else {
        outEl.innerHTML = outcomeLineHTML(null, rr, finalPrice, curr);
      }
    }
  });

  // cross-check
  OVERHEAD_LINES.forEach(l=>{
    const total = parseFloat(overhead[l.key])||0;
    let allocated = 0;
    products.forEach(p=>{ allocated += results[p.key].allocated[l.key]; });
    const remaining = total - allocated;
    setText(`cc-${l.key}-total`, gbp(total,2));
    setText(`cc-${l.key}-allocated`, gbp(allocated,2));
    setText(`cc-${l.key}-remaining`, gbp(remaining,2));
    const statusEl = document.getElementById(`cc-${l.key}-status`);
    if(statusEl){
      if(Math.abs(remaining) < 0.5){
        statusEl.innerHTML = '<span class="badge ok">Fully allocated</span>';
      } else if(remaining > 0.5){
        statusEl.innerHTML = `<span class="badge warn">${gbp(remaining,2)} left to allocate</span>`;
      } else {
        statusEl.innerHTML = `<span class="badge bad">Over-allocated by ${gbp(Math.abs(remaining),2)}</span>`;
      }
    }
  });

  // portfolio roll-up — does total contribution across all products cover total overhead?
  let totalContribution = 0;
  let totalOverheadShare = 0;
  let anyMissing = false;
  products.forEach(p=>{
    const r = results[p.key];
    const annualContribution = (r.contributionNI!==null && r.units>0) ? r.contributionNI * r.units : null;
    setText(`pf-${p.key}-units`, r.units>0? num(r.units,0) : '—');
    setText(`pf-${p.key}-contribution`, r.contributionNI!==null? gbp(r.contributionNI,2):'—');
    setText(`pf-${p.key}-annualcontribution`, annualContribution!==null? gbp(annualContribution,2):'—');
    setText(`pf-${p.key}-overheadshare`, gbp(r.effectiveOverheadAnnual,2));
    const coversEl = document.getElementById(`pf-${p.key}-covers`);
    if(coversEl){
      if(annualContribution===null){
        coversEl.innerHTML = '<span class="badge warn">No data yet</span>';
        anyMissing = true;
      } else if(annualContribution >= r.effectiveOverheadAnnual){
        coversEl.innerHTML = `<span class="badge ok">Yes, +${gbp(annualContribution-r.effectiveOverheadAnnual,2)}</span>`;
      } else {
        coversEl.innerHTML = `<span class="badge bad">Short by ${gbp(r.effectiveOverheadAnnual-annualContribution,2)}</span>`;
      }
    }
    if(annualContribution!==null) totalContribution += annualContribution;
    totalOverheadShare += r.effectiveOverheadAnnual;
  });
  setText('pf-total-contribution', gbp(totalContribution,2));
  setText('pf-total-overhead', gbp(totalOverheadShare,2));
  const pfStatusEl = document.getElementById('pf-total-status');
  const pfSurplus = totalContribution - totalOverheadShare;
  if(pfStatusEl){
    pfStatusEl.innerHTML = pfSurplus>=0
      ? `<span class="badge ok">Covered, +${gbp(pfSurplus,2)}</span>`
      : `<span class="badge bad">Short by ${gbp(Math.abs(pfSurplus),2)}</span>`;
  }
  const pfHeadlineEl = document.getElementById('pf-headline');
  if(pfHeadlineEl){
    let msg = pfSurplus>=0
      ? `Across all ${products.length} services, at current ROI prices and volumes, the portfolio generates ${gbp(totalContribution,2)} in contribution against ${gbp(totalOverheadShare,2)} of overhead — a surplus of ${gbp(pfSurplus,2)}.`
      : `Across all ${products.length} services, at current ROI prices and volumes, the portfolio generates ${gbp(totalContribution,2)} in contribution against ${gbp(totalOverheadShare,2)} of overhead — a shortfall of ${gbp(Math.abs(pfSurplus),2)}.`;
    if(anyMissing){
      msg += ' This total is partial — some services don\'t have a price and units/year entered yet, so their contribution isn\'t counted.';
    }
    const totalUnallocated = OVERHEAD_LINES.reduce((s,l)=> s + Math.max(0, lineRemaining[l.key]||0), 0);
    if(totalUnallocated > 0.5){
      msg += ` Also, ${gbp(totalUnallocated,2)} of overhead hasn't been assigned to any service yet (see Cross-check) — once it is, the total overhead figure here will rise.`;
    }
    pfHeadlineEl.innerHTML = `<div class="note" style="border-left-color:${pfSurplus>=0?'var(--green)':'var(--red)'};">${msg}</div>`;
  }

  // Dashboard: portfolio-health KPI + attention feed
  {
    const surplusEl = document.getElementById('dash-kpi-surplus');
    if(surplusEl){
      surplusEl.textContent = (pfSurplus>=0?'+':'−')+gbp(Math.abs(pfSurplus),0);
      surplusEl.style.color = pfSurplus>=0 ? 'var(--green)' : 'var(--red)';
    }
    setText('dash-kpi-surplus-sub', pfSurplus>=0 ? 'Contribution covers overhead' : 'Contribution short of overhead');
    let healthy=0, priced=0;
    products.forEach(p=>{
      const r = results[p.key];
      if(r.priceNI!==null) priced++;
      if(r.marginVatPct!==null && r.marginVatPct>=15) healthy++;
      if(r.priceNI===null){
        dashAttn.push({sev:'warn', goto:p.key, text:`${p.name} has no ROI price set yet`});
      } else if(r.gapNI!==null && r.gapNI<0){
        dashAttn.push({sev:'bad', goto:p.key, text:`${p.name} is pricing below its cost floor — losing ${gbp(Math.abs(r.gapNI),2)} per ${p.unit}`});
      } else if(r.marginVatPct!==null && r.marginVatPct<15){
        dashAttn.push({sev:'warn', goto:p.key, text:`${p.name} margin is thin (${num(r.marginVatPct,1)}%)`});
      }
    });
    setText('dash-kpi-health', `${healthy} of ${products.length}`);
    setText('dash-kpi-health-sub', `${priced} of ${products.length} routes priced`);
    const totalUnallocatedNow = OVERHEAD_LINES.reduce((s,l)=> s + Math.max(0, lineRemaining[l.key]||0), 0);
    if(totalUnallocatedNow > 0.5){
      dashAttn.push({sev:'warn', goto:'overhead', text:`${gbp(totalUnallocatedNow,2)} of overhead hasn't been assigned to a service yet`});
    }
    if(pfSurplus<0 && totalContribution>0){
      dashAttn.push({sev:'bad', goto:'floorsummary', text:`Portfolio-wide shortfall of ${gbp(Math.abs(pfSurplus),2)} — contribution doesn't yet cover total overhead`});
    }
    const so1Done = SO1_ACTIONS.filter(a=>so1ActionState[a.key]).length;
    setText('dash-kpi-actions', `${so1Done} of ${SO1_ACTIONS.length}`);
    const nextAction = SO1_ACTIONS.find(a=>!so1ActionState[a.key]);
    setText('dash-kpi-actions-sub', nextAction ? `Next: ${nextAction.label}` : 'All SO1 actions done');
  }

  // summary
  products.forEach(p=>{
    const r = results[p.key];
    setText(`sum-${p.key}-direct`, r.directPerUnit!==null? gbp(r.directPerUnit,2):'—');
    setText(`sum-${p.key}-overhead`, r.overheadPerUnit!==null? gbp(r.overheadPerUnit,2):'—');
    setText(`sum-${p.key}-floor`, r.costFloor!==null? gbp(r.costFloor,2):'—');
    setText(`sum-${p.key}-price`, r.priceNI!==null? gbp(r.priceNI,2):'—');
    setText(`sum-${p.key}-gap`, r.gapNI!==null? (r.gapNI>=0?'+':'−')+gbp(Math.abs(r.gapNI),2):'—');
    setText(`sum-${p.key}-contribution`, r.contributionNI!==null? gbp(r.contributionNI,2):'—');
    setText(`sum-${p.key}-breakeven`, r.breakEvenNI!==null? num(r.breakEvenNI,0):'—');
    setText(`sum-${p.key}-profittarget`, r.profitTargetSalesNI!==null? num(r.profitTargetSalesNI,0):'—');
    setText(`sum-${p.key}-units`, r.units>0? num(r.units,0):'—');
    setText(`sum-${p.key}-surplus`, r.surplusNI!==null? (r.surplusNI>=0? '+'+num(r.surplusNI,0):num(r.surplusNI,0)):'—');
  });

  // VAT & margin reconciliation — product tabs, VAT reconciliation tab, and reconciliation summary
  const decisionLabels = {hold:'Hold', raise:'Raise', lower:'Lower', investigate:'Investigate'};
  products.forEach(p=>{
    const r = results[p.key];
    const basisLbl = r.priceBasis==='inc'? 'inc-VAT' : 'ex-VAT';
    const rateLbl = num(r.vatRate,r.vatRate%1===0?0:1)+'%';

    // product tab reconciliation stats
    setText(`out-${p.key}-trueexvat`, r.trueExVat!==null? gbp(r.trueExVat,2):'—');
    setText(`out-${p.key}-vatratelbl`, rateLbl);
    setText(`out-${p.key}-vatamount`, r.vatAmount!==null? gbp(r.vatAmount,2):'—');
    setText(`out-${p.key}-priceincvat`, r.priceIncVat!==null? gbp(r.priceIncVat,2):'—');
    setText(`out-${p.key}-marginvat`, r.marginVat!==null? gbp(r.marginVat,2):'—');
    setText(`out-${p.key}-marginvatpct`, r.marginVatPct!==null? num(r.marginVatPct,1)+'%':'—');
    const mbEl = document.getElementById(`out-${p.key}-marginbadge`);
    if(mbEl) mbEl.innerHTML = marginBadge(r.marginVatPct);

    // proposed-price outcome note
    const propEl = document.getElementById(`out-${p.key}-proposedoutcome`);
    if(propEl){
      const pp = p.proposedPrice;
      if(pp===null || pp===undefined || pp==='' || r.costFloor===null){
        propEl.innerHTML = '';
      } else {
        const propTrue = r.priceBasis==='inc'? pp/(1+r.vatRate/100) : parseFloat(pp);
        const propMargin = propTrue - r.costFloor;
        const propMarginPct = propTrue>0? propMargin/propTrue*100 : null;
        propEl.innerHTML = `<div class="note">At the proposed price of ${gbp(pp,2)} (${basisLbl}): true ex-VAT ${gbp(propTrue,2)}, margin ${gbp(propMargin,2)} (${propMarginPct!==null?num(propMarginPct,1)+'%':'—'}). ${marginBadge(propMarginPct)}</div>`;
      }
    }

    // VAT reconciliation tab
    setText(`vat-${p.key}-price`, r.priceNI!==null? gbp(r.priceNI,2):'—');
    setText(`vat-${p.key}-basis`, r.priceNI!==null? basisLbl:'—');
    setText(`vat-${p.key}-rate`, rateLbl);
    setText(`vat-${p.key}-trueexvat`, r.trueExVat!==null? gbp(r.trueExVat,2):'—');
    setText(`vat-${p.key}-vat`, r.vatAmount!==null? gbp(r.vatAmount,2):'—');
    setText(`vat-${p.key}-shouldbe`, r.priceIncVat!==null? gbp(r.priceIncVat,2):'—');
    setText(`vat-${p.key}-margin`, r.marginVat!==null? gbp(r.marginVat,2):'—');
    setText(`vat-${p.key}-marginpct`, r.marginVatPct!==null? num(r.marginVatPct,1)+'%':'—');

    // reconciliation summary
    setText(`recon-${p.key}-floor`, r.costFloor!==null? gbp(r.costFloor,2):'—');
    setText(`recon-${p.key}-price`, r.priceNI!==null? gbp(r.priceNI,2):'—');
    setText(`recon-${p.key}-basis`, r.priceNI!==null? basisLbl:'—');
    setText(`recon-${p.key}-trueexvat`, r.trueExVat!==null? gbp(r.trueExVat,2):'—');
    setText(`recon-${p.key}-vat`, r.vatAmount!==null? gbp(r.vatAmount,2):'—');
    setText(`recon-${p.key}-shouldbe`, r.priceIncVat!==null? gbp(r.priceIncVat,2):'—');
    setText(`recon-${p.key}-margin`, r.marginVat!==null? gbp(r.marginVat,2):'—');
    setText(`recon-${p.key}-marginpct`, r.marginVatPct!==null? num(r.marginVatPct,1)+'%':'—');
    setText(`recon-${p.key}-decision`, decisionLabels[p.repriceDecision] || '—');
    setText(`recon-${p.key}-proposed`, (p.proposedPrice!==null && p.proposedPrice!==undefined && p.proposedPrice!=='')? gbp(parseFloat(p.proposedPrice),2)+' ('+basisLbl+')' : '—');
    const agrEl = document.getElementById(`recon-${p.key}-agreed`);
    if(agrEl) agrEl.innerHTML = p.agreed? '<span class="badge ok">Agreed</span>' : '<span class="badge warn">Draft</span>';

    // cost floor summary
    setText(`fs-${p.key}-direct`, r.directPerUnit!==null? gbp(r.directPerUnit,2):'—');
    setText(`fs-${p.key}-overhead`, r.overheadPerUnit!==null? gbp(r.overheadPerUnit,2):'—');
    setText(`fs-${p.key}-floor`, r.costFloor!==null? gbp(r.costFloor,2):'—');
    setText(`fs-${p.key}-units`, r.units>0? num(r.units,0):'—');
    setText(`fs-${p.key}-price`, r.priceNI!==null? gbp(r.priceNI,2):'—');
    setText(`fs-${p.key}-gap`, r.gapNI!==null? (r.gapNI>=0?'+':'−')+gbp(Math.abs(r.gapNI),2):'—');
    setText(`fs-${p.key}-trueexvat`, r.trueExVat!==null? gbp(r.trueExVat,2):'—');
    setText(`fs-${p.key}-margin`, r.marginVat!==null? gbp(r.marginVat,2):'—');
    setText(`fs-${p.key}-marginpct`, r.marginVatPct!==null? num(r.marginVatPct,1)+'%':'—');

    // ROI / NI price summary at the aggregate exchange rate
    const fx = parseFloat(exchangeRate)||0;
    setText(`fs-${p.key}-roiprice`, (r.priceNI!==null && fx>0)? eur(r.priceNI*fx,2):'—');
    setText(`fx-${p.key}-ni`, r.priceNI!==null? gbp(r.priceNI,2):'—');
    setText(`fx-${p.key}-roi`, (r.priceNI!==null && fx>0)? eur(r.priceNI*fx,2):'—');
    const propNI = (p.proposedPrice!==null && p.proposedPrice!==undefined && p.proposedPrice!=='')? parseFloat(p.proposedPrice):null;
    setText(`fx-${p.key}-propni`, propNI!==null? gbp(propNI,2):'—');
    setText(`fx-${p.key}-proproi`, (propNI!==null && fx>0)? eur(propNI*fx,2):'—');

    // Step A — competitor price range, floor/current-price reference, reprice outcome (per market)
    ['ni','roi'].forEach(mkt=>{
      const cd = competitorData[p.key] ? competitorData[p.key][mkt] : null;
      const sym = mkt==='ni'?'€':'£';
      let nums = [];
      if(cd){ cd.list.forEach(e=>{ nums = nums.concat(parsePriceNums(e.price)); }); }
      const rangeEl = document.getElementById(`range-${p.key}-${mkt}`);
      if(rangeEl){
        if(nums.length){
          const lo=Math.min.apply(null,nums), hi=Math.max.apply(null,nums), avg=nums.reduce((a,b)=>a+b,0)/nums.length;
          rangeEl.textContent = (lo===hi)? `${sym}${num(lo,2)}` : `${sym}${num(lo,2)} – ${sym}${num(hi,2)} (avg ${sym}${num(avg,2)})`;
        } else rangeEl.textContent = '—';
      }
      const crefEl = document.getElementById(`cref-${p.key}-${mkt}`);
      if(crefEl){
        const floorTxt = r.costFloor!==null? gbp(r.costFloor,2) : '—';
        let priceTxt;
        if(mkt==='ni') priceTxt = r.priceNI!==null? gbp(r.priceNI,2) : '—';
        else priceTxt = (r.roiPrice!==null && r.roiPrice!==undefined)? eur(r.roiPrice,2)+' (market)' : (fx>0 && r.priceNI!==null? eur(r.priceNI*fx,2)+' (converted)' : '—');
        crefEl.innerHTML = `Your cost floor: <b>${floorTxt}</b> &nbsp;·&nbsp; Current ${mktLabel(mkt)} price: <b>${priceTxt}</b>`;
      }
      const decision = mkt==='ni'? p.repriceDecision : p.roiRepriceDecision;
      const proposed = mkt==='ni'? p.proposedPrice : p.roiProposedPrice;
      const money = mkt==='ni'? gbp : eur;
      const outEl = document.getElementById(`out-reprice-${p.key}-${mkt}`);
      if(outEl){
        if((decision==='raise'||decision==='lower') && proposed!==null && proposed!==undefined && proposed!=='' && r.costFloor!==null){
          const pnum = parseFloat(proposed);
          let trueEx = pnum;
          if(mkt==='ni') trueEx = p.priceBasis==='inc'? pnum/(1+(parseFloat(p.vatRate)||0)/100) : pnum;
          const m = trueEx - r.costFloor;
          const mp = trueEx>0? m/trueEx*100 : null;
          outEl.innerHTML = `<div class="note">At the proposed ${mktLabel(mkt)} price of ${money(pnum,2)}: margin vs cost floor ${money(m,2)} (${mp!==null?num(mp,1)+'%':'—'}). ${marginBadge(mp)}</div>`;
        } else outEl.innerHTML = '';
      }

      // ---- Final price summary row ----
      const goingRate = cd? cd.goingRate : '';
      let rangeTxt = '—';
      if(nums.length){ const lo=Math.min.apply(null,nums), hi=Math.max.apply(null,nums); rangeTxt = (lo===hi)? `${sym}${num(lo,2)}` : `${sym}${num(lo,2)}–${sym}${num(hi,2)}`; }
      let current, finalPrice;
      if(mkt==='ni'){
        current = r.priceNI;
        finalPrice = (p.proposedPrice!==null && p.proposedPrice!==undefined && p.proposedPrice!=='')? parseFloat(p.proposedPrice) : r.priceNI;
      } else {
        current = (r.roiPrice!==null && r.roiPrice!==undefined)? r.roiPrice : ((fx>0 && r.priceNI!==null)? r.priceNI*fx : null);
        finalPrice = (p.roiProposedPrice!==null && p.roiProposedPrice!==undefined && p.roiProposedPrice!=='')? parseFloat(p.roiProposedPrice) : current;
      }
      setText(`fps-${p.key}-${mkt}-floor`, r.costFloor!==null? money(r.costFloor,2):'—');
      setText(`fps-${p.key}-${mkt}-current`, (current!==null && current!==undefined)? money(current,2):'—');
      setText(`fps-${p.key}-${mkt}-range`, rangeTxt);
      setText(`fps-${p.key}-${mkt}-going`, goingRate||'—');
      const valPos = (p.value && p.value[mkt]? p.value[mkt].position : '') || '';
      const valLabels = {premium:'Premium', match:'At market', value:'Value (below)'};
      setText(`fps-${p.key}-${mkt}-value`, valLabels[valPos] || '—');
      setText(`fps-${p.key}-${mkt}-decision`, decisionLabels[decision] || '—');
      setText(`fps-${p.key}-${mkt}-final`, (finalPrice!==null && finalPrice!==undefined)? money(finalPrice,2):'—');
      let marginFinal = null, marginFinalPct = null;
      if(finalPrice!==null && finalPrice!==undefined && r.costFloor!==null){
        let trueEx = finalPrice;
        if(mkt==='ni') trueEx = p.priceBasis==='inc'? finalPrice/(1+(parseFloat(p.vatRate)||0)/100) : finalPrice;
        marginFinal = trueEx - r.costFloor;
        marginFinalPct = trueEx>0? marginFinal/trueEx*100 : null;
      }
      setText(`fps-${p.key}-${mkt}-margin`, marginFinal!==null? money(marginFinal,2)+(marginFinalPct!==null? ' ('+num(marginFinalPct,1)+'%)':''):'—');
      const stEl = document.getElementById(`fps-${p.key}-${mkt}-status`);
      if(stEl) stEl.innerHTML = p.agreed? '<span class="badge ok">Agreed</span>' : '<span class="badge warn">Draft</span>';
    });

    // ---- Decision impact: price × volume (ROI) ----
    (function(){
      const units = r.units;
      const direct = r.directPerUnit;
      const currentTrueEx = r.trueExVat;
      const finalNI = (p.proposedPrice!==null && p.proposedPrice!==undefined && p.proposedPrice!=='')? parseFloat(p.proposedPrice) : r.priceNI;
      let finalTrueEx = null;
      if(finalNI!==null && finalNI!==undefined) finalTrueEx = p.priceBasis==='inc'? finalNI/(1+(parseFloat(p.vatRate)||0)/100) : finalNI;
      const contribNow = (currentTrueEx!==null && direct!==null)? currentTrueEx - direct : null;
      const contribFinal = (finalTrueEx!==null && direct!==null)? finalTrueEx - direct : null;
      setText(`imp-${p.key}-units`, units>0? num(units,0):'—');
      setText(`imp-${p.key}-contribnow`, contribNow!==null? gbp(contribNow,2):'—');
      setText(`imp-${p.key}-annualnow`, (contribNow!==null && units>0)? gbp(contribNow*units,2):'—');
      setText(`imp-${p.key}-final`, (finalNI!==null && finalNI!==undefined)? gbp(finalNI,2):'—');
      setText(`imp-${p.key}-contribfinal`, contribFinal!==null? gbp(contribFinal,2):'—');
      setText(`imp-${p.key}-annualfinal`, (contribFinal!==null && units>0)? gbp(contribFinal*units,2):'—');
      const changeEl = document.getElementById(`imp-${p.key}-change`);
      if(changeEl){
        if(contribNow!==null && contribFinal!==null && units>0){
          const chg = (contribFinal-contribNow)*units;
          changeEl.textContent = (chg>=0?'+':'−')+gbp(Math.abs(chg),2);
          changeEl.style.color = chg>=0?'var(--green)':'var(--red)'; changeEl.style.fontWeight='700';
        } else { changeEl.textContent='—'; changeEl.style.color=''; changeEl.style.fontWeight=''; }
      }
      const headEl = document.getElementById(`imp-${p.key}-headroom`);
      if(headEl){
        headEl.style.fontWeight='700';
        if(contribNow===null || contribFinal===null || units<=0){ headEl.textContent='—'; headEl.style.color=''; headEl.style.fontWeight=''; }
        else if(contribFinal<=0){ headEl.textContent='price below direct cost'; headEl.style.color='var(--red)'; }
        else {
          const frac = 1 - contribNow/contribFinal;
          if(Math.abs(frac)<0.0005){ headEl.textContent='no change'; headEl.style.color=''; headEl.style.fontWeight=''; }
          else if(frac>0){ headEl.textContent='can lose up to '+num(frac*100,1)+'% of volume'; headEl.style.color='var(--green)'; }
          else { headEl.textContent='must grow ≥ '+num(Math.abs(frac)*100,1)+'% to stand still'; headEl.style.color='var(--red)'; }
        }
      }
    })();

    // keep the ROI reprice decision in sync between the product tab and Step A; NI lives in Step A
    syncInputs(`[data-action="repricedecision"][data-product="${p.key}"]`, p.repriceDecision||'');
    syncInputs(`[data-action="proposedprice"][data-product="${p.key}"]`, (p.proposedPrice===null||p.proposedPrice===undefined)?'':p.proposedPrice);
    syncInputs(`[data-action="repricereason"][data-product="${p.key}"]`, p.repriceReason||'');
    syncInputs(`[data-action="roirepricedecision"][data-product="${p.key}"]`, p.roiRepriceDecision||'');
    syncInputs(`[data-action="roiproposedprice"][data-product="${p.key}"]`, (p.roiProposedPrice===null||p.roiProposedPrice===undefined)?'':p.roiProposedPrice);
    syncInputs(`[data-action="roirepricereason"][data-product="${p.key}"]`, p.roiRepriceReason||'');
  });

  // ---------- Objective 2: 12-month forecast ----------
  {
    const monthlyRev = new Array(12).fill(0);
    const monthlyCon = new Array(12).fill(0);
    let directLabourRecovered = 0;
    products.forEach(p=>{ directLabourRecovered += results[p.key].directLabourAnnual || 0; });
    // Fixed overhead the business must clear = total overhead minus the direct labour already
    // netted out of each product's contribution (so it isn't subtracted twice).
    const fixedOverheadAnnual = Math.max(0, overheadTotal() - directLabourRecovered);
    const monthlyOverhead = fixedOverheadAnnual/12;

    let plannedSessionsTotal = 0;
    let _targetExtraSessions = 0;
    const _annRevByRoute = {};
    products.forEach(p=>{
      const r = results[p.key];
      const finalNI = (p.proposedPrice!==null && p.proposedPrice!==undefined && p.proposedPrice!=='')? parseFloat(p.proposedPrice) : r.priceNI;
      let exVat = null;
      if(finalNI!==null && finalNI!==undefined) exVat = p.priceBasis==='inc'? finalNI/(1+(parseFloat(p.vatRate)||0)/100) : finalNI;
      const contribUnit = (exVat!==null && r.directPerUnit!==null)? exVat - r.directPerUnit : null;
      setText(`fc-${p.key}-price`, (finalNI!==null && finalNI!==undefined)? gbp(finalNI,2):'—');
      setText(`fc-${p.key}-exvat`, exVat!==null? gbp(exVat,2):'—');
      setText(`fc-${p.key}-contrib`, contribUnit!==null? gbp(contribUnit,2):'—');
      setText(`fc-${p.key}-be`, r.breakEvenNI!==null? num(r.breakEvenNI,0)+' '+p.unitPlural : '—');
      const leads = parseFloat(p.fcLeadsPerMonth)||0, conv = parseFloat(p.fcConversionPct)||0;
      const impliedYr = leads*12*conv/100;
      setText(`fc-${p.key}-implied`, (leads>0 && conv>0)? num(impliedYr,0)+' '+p.unitPlural+'/yr' : '—');
      let unitTot=0, revTot=0, conTot=0;
      for(let m=0;m<12;m++){
        const v = parseFloat(p.fcVolumes[m])||0;
        unitTot += v;
        const rev = exVat!==null? exVat*v : 0;
        const con = contribUnit!==null? contribUnit*v : 0;
        revTot += rev; conTot += con;
        monthlyRev[m]+=rev; monthlyCon[m]+=con;
        setText(`fc-${p.key}-rev-${m}`, exVat!==null? gbp(rev,0):'—');
        setText(`fc-${p.key}-con-${m}`, contribUnit!==null? gbp(con,0):'—');
      }
      if(p.key!=='online') plannedSessionsTotal += unitTot;
      if(p.key!=='online' && exVat!==null && exVat>0 && parseFloat(p.routeTarget)>0) _targetExtraSessions += parseFloat(p.routeTarget)/exVat;
      _annRevByRoute[p.key] = revTot;
      setText(`fc-${p.key}-unittot`, num(unitTot,0));
      setText(`fc-${p.key}-revtot`, exVat!==null? gbp(revTot,0):'—');
      setText(`fc-${p.key}-contot`, contribUnit!==null? gbp(conTot,0):'—');
      const noteEl = document.getElementById(`fc-${p.key}-plannote`);
      if(noteEl){
        if(leads>0 && conv>0){
          const gap = unitTot - impliedYr;
          noteEl.textContent = `You've planned ${num(unitTot,0)} ${p.unitPlural} — the funnel implies ${num(impliedYr,0)}${Math.abs(gap)>0.5? (gap>0? ' (plan is '+num(gap,0)+' above the funnel — needs more leads or a higher conversion rate)' : ' (funnel could support '+num(-gap,0)+' more)') : ' (in line)'}.`;
        } else noteEl.textContent = '';
      }
    });

    let annRev=0, annCon=0, cumul=0;
    for(let m=0;m<12;m++){
      const surplus = monthlyCon[m] - monthlyOverhead;
      cumul += surplus; annRev+=monthlyRev[m]; annCon+=monthlyCon[m];
      setText(`fcco-rev-${m}`, gbp(monthlyRev[m],0));
      setText(`fcco-con-${m}`, gbp(monthlyCon[m],0));
      setText(`fcco-oh-${m}`, gbp(monthlyOverhead,0));
      const sEl=document.getElementById(`fcco-sur-${m}`); if(sEl){ sEl.textContent=(surplus<0?'−':'')+gbp(Math.abs(surplus),0); sEl.style.color=surplus>=0?'var(--green)':'var(--red)'; }
      const cEl=document.getElementById(`fcco-cum-${m}`); if(cEl){ cEl.textContent=(cumul<0?'−':'')+gbp(Math.abs(cumul),0); cEl.style.color=cumul>=0?'var(--green)':'var(--red)'; cEl.style.fontWeight='700'; }
    }
    setText('fcco-rev-total', gbp(annRev,0));
    setText('fcco-con-total', gbp(annCon,0));
    setText('fcco-oh-total', gbp(fixedOverheadAnnual,0));
    const annSurplus = annCon - fixedOverheadAnnual;
    setText('dash-kpi-contrib', annRev>0? gbp(annCon,0) : '—');
    setText('dash-kpi-contrib-sub', annRev>0? num(annCon/annRev*100,1)+'% of planned revenue' : 'Set monthly volumes in Forecast');
    setText('dash-kpi-revenue', gbp(annRev,0));
    setText('dash-kpi-revenue-sub', annRev>0 ? `${annSurplus>=0?'Surplus':'Shortfall'} of ${gbp(Math.abs(annSurplus),0)} over 12 months` : 'Set monthly volumes in Forecast to populate');
    if(annRev===0){
      dashAttn.push({sev:'warn', goto:'forecast', text:'12-month forecast has no volumes planned yet'});
    }
    const stTot=document.getElementById('fcco-sur-total'); if(stTot){ stTot.textContent=(annSurplus<0?'−':'')+gbp(Math.abs(annSurplus),0); stTot.style.color=annSurplus>=0?'var(--green)':'var(--red)'; stTot.style.fontWeight='700'; }

    // ---- Workforce & capacity (SO1 action 7) ----
    const wfCur=parseFloat(workforcePlan.currentTrainers)||0, wfTgt=parseFloat(workforcePlan.targetTrainers)||0;
    const wfSpw=parseFloat(workforcePlan.sessionsPerWeek)||0, wfWpy=parseFloat(workforcePlan.weeksPerYear)||0;
    const perTrainerYr = wfSpw*wfWpy;
    setText('wf-planned', plannedSessionsTotal>0? num(plannedSessionsTotal,0)+' sessions' : '—');
    setText('wf-capnow', (wfCur>0&&perTrainerYr>0)? num(wfCur*perTrainerYr,0)+' sessions' : '—');
    setText('wf-captarget', (wfTgt>0&&perTrainerYr>0)? 'At target ('+num(wfTgt,0)+' trainers): '+num(wfTgt*perTrainerYr,0)+' sessions' : '');
    const wfReq = (perTrainerYr>0&&plannedSessionsTotal>0)? Math.ceil(plannedSessionsTotal/perTrainerYr) : null;
    setText('wf-required', wfReq!==null? num(wfReq,0)+' trainers' : '—');
    const wfTargetSessions = plannedSessionsTotal + _targetExtraSessions;
    const wfReqTarget = (perTrainerYr>0 && _targetExtraSessions>0)? Math.ceil(wfTargetSessions/perTrainerYr) : null;
    const wfTgtLine = document.getElementById('wf-required-target');
    if(wfTgtLine) wfTgtLine.textContent = wfReqTarget!==null? ('At the growth targets: ~'+num(wfReqTarget,0)+' trainers ('+num(wfTargetSessions,0)+' sessions/yr)') : '';
    const wfNote = document.getElementById('wf-note');
    if(wfNote){
      if(wfReq!==null && wfCur>0){
        if(wfReq<=wfCur){
          wfNote.innerHTML = `<div class="note" style="border-left-color:var(--green);">The plan is staffable — ${num(plannedSessionsTotal,0)} sessions needs ${num(wfReq,0)} trainer${wfReq===1?'':'s'} and you have ${num(wfCur,0)}.</div>`;
        } else {
          wfNote.innerHTML = `<div class="note" style="border-left-color:var(--red);">Staffing gap: the plan needs ${num(wfReq,0)} trainers but you have ${num(wfCur,0)} — recruit ${num(wfReq-wfCur,0)} more${wfTgt>0? ' (trajectory target '+num(wfTgt,0)+')':''} or re-phase the volume.</div>`;
          dashAttn.push({sev:'bad', goto:'forecast', text:`Forecast needs ~${num(wfReq,0)} trainers — only ${num(wfCur,0)} in place (recruit ${num(wfReq-wfCur,0)})`});
        }
      } else wfNote.innerHTML='';
    }

    // ---- ROI market sizing (SO1 action 2) ----
    let roiImpliedTotal=0;
    ['nursinghomes','onetoone','patientgroups'].forEach(k=>{
      const p=findProduct(k); const r=results[k]; const s=roiMarketSizing[k]||{};
      const pop=parseFloat(String(s.population||'').replace(/[^0-9.]/g,''))||0, sh=parseFloat(s.share)||0, fq=parseFloat(s.freq)||0;
      let exv=null;
      if(p&&r){
        const fNI=(p.proposedPrice!==null&&p.proposedPrice!==undefined&&p.proposedPrice!=='')? parseFloat(p.proposedPrice):r.priceNI;
        if(fNI!==null&&fNI!==undefined) exv = p.priceBasis==='inc'? fNI/(1+(parseFloat(p.vatRate)||0)/100) : fNI;
      }
      const units=pop*sh/100*fq;
      const implied=(units>0&&exv!==null)? units*exv : null;
      setText('roi-implied-'+k, implied!==null? gbp(implied,0) : (units>0? num(units,0)+' sessions/yr — set a price' : '—'));
      if(implied) roiImpliedTotal+=implied;
    });
    setText('roi-implied-total', roiImpliedTotal>0? gbp(roiImpliedTotal,0) : '—');
    const _amb=parseFloat(marketTargets.ambition)||0, _base=parseFloat(marketTargets.baseline)||0;
    const _gap=(_amb>0&&_base>0)? _amb-_base : null;
    setText('roi-vs-gap', (roiImpliedTotal>0&&_gap!==null&&_gap>0)? (roiImpliedTotal>=_gap? 'Covers the gap ('+num(roiImpliedTotal/_gap*100,0)+'%)' : 'Covers '+num(roiImpliedTotal/_gap*100,0)+'% of the gap') : '—');
    const roiNote=document.getElementById('roi-sizing-note');
    if(roiNote){
      if(roiImpliedTotal>0&&_gap!==null&&_gap>0){
        roiNote.innerHTML = roiImpliedTotal>=_gap
          ? `<div class="note" style="border-left-color:var(--green);">At that share the market is worth ${gbp(roiImpliedTotal,0)}/yr against a growth gap of ${gbp(_gap,0)} — the target passes the bottom-up sense-check.</div>`
          : `<div class="note" style="border-left-color:var(--amber);">At that share the sized market yields ${gbp(roiImpliedTotal,0)}/yr against a growth gap of ${gbp(_gap,0)} — either the obtainable share must rise, more routes must carry weight, or the target timing extends.</div>`;
      } else roiNote.innerHTML='';
    }

    // ---- HSE watching brief ----
    const _hse=parseFloat(marketTargets.hseIncome)||0;
    const hsePct=(_hse>0&&_base>0)? _hse/_base*100 : null;
    const hseHint=document.getElementById('mt-hse-share');
    if(hseHint) hseHint.textContent = hsePct!==null? ('HSE ≈ '+num(hsePct,0)+'% of current income — on a watching brief, visible but not driving.') : "Concentration stays visible, not driving — the board's footnote.";
    const hseBrief=document.getElementById('dash-hse-brief');
    if(hseBrief){
      if(hsePct!==null){ hseBrief.style.display=''; hseBrief.innerHTML=`<b>Watching brief:</b> HSE is ${gbp(_hse,0)} ≈ <b>${num(hsePct,0)}%</b> of current income — unsecured beyond 2027. The growth-led plan stands; concentration stays visible, not driving.`; }
      else hseBrief.style.display='none';
    }

    // ---- Path to the ambition: the bridge ----
    const bridgeEl = document.getElementById('dash-bridge');
    if(bridgeEl){
      if(_amb>0 && _base>0){
        const routeColors = {nursinghomes:'var(--brand-blue-deep)', patientgroups:'#4fc6e0', onetoone:'var(--brand-yellow-deep)', hospital:'#8fb7c6', online:'#b78fc6'};
        let cum = 0;
        const basePct = Math.min(100, _base/_amb*100);
        let rows = `<div class="metric-row" style="grid-template-columns:170px 1fr 120px;"><span style="color:var(--muted);">Current baseline <span style="font-size:9px;">(reference)</span></span><div class="bar" style="background:transparent; border:1px dashed var(--line);"><span style="width:${basePct}%; background:repeating-linear-gradient(45deg,#c9dfe6,#c9dfe6 5px,#e7f2f5 5px,#e7f2f5 10px);"></span></div><span style="text-align:right; color:var(--muted);">${gbp(_base,0)}</span></div>`;
        products.forEach(p=>{
          const rv = _annRevByRoute[p.key]||0;
          if(rv>0){
            const startPct = Math.min(100, cum/_amb*100);
            cum += rv;
            const wPct = Math.max(0.5, Math.min(100-startPct, rv/_amb*100));
            rows += `<div class="metric-row" style="grid-template-columns:170px 1fr 120px;"><span>${esc(p.name)}</span><div class="bar"><span style="margin-left:${startPct}%; width:${wPct}%; background:${routeColors[p.key]||'var(--brand-blue-deep)'}; border-radius:8px;"></span></div><span style="text-align:right;">${gbp(rv,0)}</span></div>`;
          }
        });
        const shortfall = _amb - cum;
        const growth = cum - _base;
        const pct = Math.min(100, cum/_amb*100);
        rows += `<div class="metric-row" style="grid-template-columns:170px 1fr 120px; border-top:1px solid var(--line); padding-top:8px;"><span style="font-weight:800;">Planned annual income</span><div class="bar" style="height:12px;"><span style="width:${pct}%; background:linear-gradient(90deg,var(--brand-navy),var(--brand-blue-deep));"></span></div><span style="text-align:right; font-weight:800;">${gbp(cum,0)}</span></div>`;
        rows += shortfall<=0
          ? `<div class="note" style="border-left-color:var(--green);">The 12-month plan reaches the ambition — ${gbp(cum,0)} against ${gbp(_amb,0)}${shortfall<0? ' ('+gbp(Math.abs(shortfall),0)+' of headroom)':''}${growth>0? ', '+gbp(growth,0)+' of growth on the current baseline':''}.</div>`
          : `<div class="note" style="border-left-color:var(--amber);">The 12-month plan totals ${gbp(cum,0)} — ${growth>=0? gbp(growth,0)+' of growth on the baseline, but ':''}<strong>${gbp(shortfall,0)} short of the ${gbp(_amb,0)} ambition</strong> (${num(pct,0)}% covered). More volume, a further reprice, or a longer runway closes it.</div>`;
        bridgeEl.innerHTML = rows;
      } else {
        bridgeEl.innerHTML = '<p class="empty-note">Set the ambition and baseline in Market &amp; Targets, then plan volumes in Volume &amp; Forecast, to see the bridge build.</p>';
      }
    }

    // ---- Closing the growth gap ----
    const gapCloseEl = document.getElementById('gap-close');
    if(gapCloseEl){
      if(_gap!==null && _gap>0){
        let _annRevAll = 0; Object.keys(_annRevByRoute).forEach(k=>{ _annRevAll += _annRevByRoute[k]||0; });
        const planGrowth = Math.max(0, _annRevAll - _base);
        let _wtd = 0; pipeline.forEach(o=>{ const v=parseFloat(o.value)||0, pr=parseFloat(o.probability)||0; _wtd += v*pr/100; });
        let _contracted = 0; contracts.forEach(ct=>{ _contracted += parseFloat(ct.annualValue)||0; });
        const gcRow = (label, val, color)=>{
          const pct = Math.min(100, _gap>0? val/_gap*100 : 0);
          return `<div class="metric-row" style="grid-template-columns:220px 1fr 150px;"><span>${label}</span><div class="bar"><span style="width:${pct}%; background:${color};"></span></div><span style="text-align:right;">${gbp(val,0)} · ${num(_gap>0? val/_gap*100:0,0)}% of gap</span></div>`;
        };
        let gcHtml = `<div class="metric-row" style="grid-template-columns:220px 1fr 150px;"><span style="font-weight:800;">Growth gap to close</span><div class="bar" style="height:12px;"><span style="width:100%; background:var(--brand-navy);"></span></div><span style="text-align:right; font-weight:800;">${gbp(_gap,0)}</span></div>`;
        gcHtml += gcRow('12-month plan growth', planGrowth, 'var(--brand-blue-deep)');
        gcHtml += gcRow('Weighted sales pipeline', _wtd, 'var(--brand-yellow-deep)');
        gcHtml += gcRow('Contracted recurring income', _contracted, 'var(--good)');
        const unplanned = _gap - planGrowth;
        gcHtml += unplanned > 0
          ? `<div class="note" style="border-left-color:var(--amber);">${gbp(unplanned,0)} of the gap has no volume against it yet in the 12-month plan. Rule of thumb: the weighted pipeline should run at ≥3× the unclosed gap — right now that would mean ${gbp(unplanned*3,0)} of weighted pipeline against ${gbp(_wtd,0)} live.</div>`
          : `<div class="note" style="border-left-color:var(--green);">The 12-month plan fully covers the gap — the job now is landing it: pipeline coverage and contracted income are the numbers to watch.</div>`;
        gapCloseEl.innerHTML = gcHtml;
      } else {
        gapCloseEl.innerHTML = '<p class="empty-note">Set the ambition and baseline in Market &amp; Targets to see progress against the gap.</p>';
      }
    }

    // ---- Bookings needed for the ambition ----
    const bookingsEl = document.getElementById('dash-bookings');
    if(bookingsEl){
      const unitWord = {nursinghomes:'slots', patientgroups:'groups', onetoone:'clients', hospital:'slots'};
      let bkRows = '', tToday=0, tAdd=0, tSessions=0, anyBk=false;
      products.forEach(p=>{
        if(p.key==='online') return;
        const r = results[p.key];
        const finalNI = (p.proposedPrice!==null && p.proposedPrice!==undefined && p.proposedPrice!=='')? parseFloat(p.proposedPrice) : r.priceNI;
        let exv = null;
        if(finalNI!==null && finalNI!==undefined) exv = p.priceBasis==='inc'? finalNI/(1+(parseFloat(p.vatRate)||0)/100) : finalNI;
        let planSessions = 0; (p.fcVolumes||[]).forEach(v=>{ planSessions += parseFloat(v)||0; });
        const tgt = parseFloat(p.routeTarget)||0;
        const growthSessions = (tgt>0 && exv>0)? tgt/exv : 0;
        if(planSessions<=0 && growthSessions<=0) return;
        anyBk = true;
        const today = planSessions/52, add = growthSessions/52, total = today+add;
        tToday+=today; tAdd+=add; tSessions+=planSessions+growthSessions;
        bkRows += `<tr>
          <td style="white-space:nowrap;"><b>${esc(p.name)}</b>${exv? ' <span style="color:var(--muted);">@ '+gbp(exv,0)+'</span>':''}</td>
          <td style="text-align:right;">${num(today,0)} ${unitWord[p.key]||'slots'}</td>
          <td style="text-align:right; font-weight:700;">+${num(add,0)}</td>
          <td style="text-align:right; font-weight:800;">${num(total,0)}</td>
          <td style="text-align:right; color:var(--muted);">${num(planSessions+growthSessions,0)}</td>
        </tr>`;
      });
      if(anyBk){
        const mult = tToday>0? (tToday+tAdd)/tToday : null;
        bookingsEl.innerHTML = `<div class="summary-table"><table>
          <thead><tr><th>Route</th><th style="text-align:right;">Has today (plan)</th><th style="text-align:right;">To add (targets)</th><th style="text-align:right;">Book at ambition</th><th style="text-align:right;">Sessions/yr</th></tr></thead>
          <tbody>${bkRows}</tbody>
          <tfoot><tr style="font-weight:800;"><td>Total weekly bookings</td><td style="text-align:right;">${num(tToday,0)}</td><td style="text-align:right;">+${num(tAdd,0)}</td><td style="text-align:right;">${num(tToday+tAdd,0)}</td><td style="text-align:right;">${num(tSessions,0)}</td></tr></tfoot>
        </table></div>`
        + (mult && mult>1.05? `<div class="note">Reaching the targets means growing the book of business to about <strong>${num(mult,1)}×</strong> its currently planned size — every price increase agreed in the Pricing engine directly shrinks the number of bookings (and trainers) this table demands.</div>` : '');
      } else {
        bookingsEl.innerHTML = '<p class="empty-note">Set route growth targets above and plan volumes in Volume &amp; Forecast to see the bookings maths.</p>';
      }
    }
    const headEl=document.getElementById('fc-headline');
    if(headEl){
      const hasPlan = annRev>0;
      headEl.innerHTML = hasPlan
        ? `<div class="note" style="border-left-color:${annSurplus>=0?'var(--green)':'var(--red)'};">Over the 12 months planned: revenue ${gbp(annRev,0)}, contribution ${gbp(annCon,0)}, fixed overhead ${gbp(fixedOverheadAnnual,0)} → ${annSurplus>=0?'surplus':'shortfall'} of ${gbp(Math.abs(annSurplus),0)}. Cumulative position ends the year at ${cumul<0?'−':''}${gbp(Math.abs(cumul),0)}.</div>`
        : `<div class="note">Enter monthly volumes below (or set leads and a conversion rate) to build the forecast. Prices come from your Final price summary.</div>`;
    }
  }

  // ---------- Sales pipeline (weighted value, per product + per month → forecast) ----------
  {
    const wByProduct={}, cByProduct={}, vByProduct={}, vByStage={};
    const pipeMonthly=new Array(12).fill(0);
    let tV=0, tW=0;
    pipeline.forEach(o=>{
      const val=parseFloat(o.value)||0, prob=parseFloat(o.probability)||0;
      const w = val*prob/100;
      setText('opp-weighted-'+o.id, gbp(w,0));
      const key = o.product||'other';
      cByProduct[key]=(cByProduct[key]||0)+1;
      vByProduct[key]=(vByProduct[key]||0)+val;
      wByProduct[key]=(wByProduct[key]||0)+w;
      tV+=val; tW+=w;
      vByStage[o.stage||'lead']=(vByStage[o.stage||'lead']||0)+val;
      const m=parseInt(o.closeMonth,10);
      if(!isNaN(m) && m>=1 && m<=12) pipeMonthly[m-1]+=w;
    });
    products.forEach(p=>{
      setText('pipe-sum-'+p.key+'-count', String(cByProduct[p.key]||0));
      setText('pipe-sum-'+p.key+'-value', gbp(vByProduct[p.key]||0,0));
      setText('pipe-sum-'+p.key+'-weighted', gbp(wByProduct[p.key]||0,0));
    });
    setText('pipe-sum-other-count', String(cByProduct['other']||0));
    setText('pipe-sum-other-value', gbp(vByProduct['other']||0,0));
    setText('pipe-sum-other-weighted', gbp(wByProduct['other']||0,0));
    setText('pipe-sum-total-count', String(pipeline.length));
    setText('pipe-sum-total-value', gbp(tV,0));
    setText('pipe-sum-total-weighted', gbp(tW,0));
    for(let m=0;m<12;m++) setText('fcco-pipe-'+m, gbp(pipeMonthly[m],0));
    setText('fcco-pipe-total', gbp(pipeMonthly.reduce((a,b)=>a+b,0),0));

    _dashPipe = {tW:tW, tV:tV, wByProduct:wByProduct, vByStage:vByStage};
    const sbEl = document.getElementById('dash-stagebars');
    if(sbEl){
      if(!pipeline.length){ sbEl.innerHTML = '<p class="empty-note">No prospects yet — add them on the Sales Pipeline tab.</p>'; }
      else {
        const maxV = Math.max(1, ...PIPELINE_STAGES.map(s=>vByStage[s.key]||0));
        sbEl.innerHTML = PIPELINE_STAGES.filter(s=>s.key!=='lost').map(s=>{
          const v = vByStage[s.key]||0;
          return `<div class="metric-row"><span>${s.label}</span><div class="bar"><span style="width:${Math.round(v/maxV*100)}%"></span></div><b>${gbp(v,0)}</b></div>`;
        }).join('');
      }
    }
    renderPipelineKanban();
    setText('dash-kpi-pipeline', gbp(tW,0));
    setText('dash-kpi-pipeline-sub', `${pipeline.length} prospect${pipeline.length===1?'':'s'} · ${gbp(tV,0)} total value`);
    if(pipeline.length===0){
      dashAttn.push({sev:'warn', goto:'pipeline', text:'No prospects logged in the sales pipeline yet'});
    }
  }

  // ---------- CRM: accounts, contracts, growth target ----------
  {
    const totalPotential = accounts.reduce((s,a)=>s+(parseFloat(a.potential)||0),0);
    const warm = accounts.filter(a=>a.relationship==='warm'||a.relationship==='existing').length;
    // existing clients don't need a standing next action — only flag prospects/developing accounts without one
    const noAction = accounts.filter(a=>a.relationship!=='existing' && !(a.nextAction||'').trim()).length;
    setText('acc-kpi-count', String(accounts.length));
    setText('acc-kpi-count-sub', accounts.length? `${warm} warm or existing` : 'Add your first account');
    setText('acc-kpi-potential', gbp(totalPotential,0));
    setText('acc-kpi-warm', `${warm} of ${accounts.length}`);
    setText('acc-kpi-noaction', String(noAction));
    if(noAction>0) dashAttn.push({sev:'warn', goto:'accounts', text:`${noAction} account${noAction===1?' has':'s have'} no next action logged`});
    const ctrValue = contracts.reduce((s,c)=>s+(parseFloat(c.annualValue)||0),0);
    const riskValue = contracts.filter(c=>c.health==='risk').reduce((s,c)=>s+(parseFloat(c.annualValue)||0),0);
    const watchCount = contracts.filter(c=>c.health==='watch').length;
    const riskCount = contracts.filter(c=>c.health==='risk').length;
    setText('ctr-kpi-count', String(contracts.length));
    setText('ctr-kpi-count-sub', contracts.length? `${riskCount} at risk · ${watchCount} on watch` : 'Log won business here');
    setText('ctr-kpi-value', gbp(ctrValue,0));
    setText('ctr-kpi-risk', gbp(riskValue,0));
    setText('ctr-kpi-risk-sub', riskCount? `${riskCount} contract${riskCount===1?'':'s'}` : 'None flagged');
    setText('ctr-kpi-watch', String(watchCount));
    if(riskCount>0) dashAttn.push({sev:'bad', goto:'contracts', text:`${gbp(riskValue,0)} of contracted income is at risk (${riskCount} contract${riskCount===1?'':'s'})`});
    const amb = parseFloat(marketTargets.ambition)||0, base = parseFloat(marketTargets.baseline)||0;
    const gap = amb>0? amb-base : null;
    setText('mt-gap', gap!==null? gbp(gap,0) : '—');
    setText('dash-kpi-gap', gap!==null? gbp(gap,0) : '—');
    setText('dash-kpi-gap-sub', gap!==null? (marketTargets.targetDate? 'By '+marketTargets.targetDate : 'Ambition minus baseline') : 'Set in Market & Targets');
    const mtNote = document.getElementById('mt-note');
    if(mtNote){
      mtNote.innerHTML = gap!==null
        ? `<div class="note">The growth gap is <strong>${gbp(gap,0)}</strong>${marketTargets.targetDate? ' by '+esc(marketTargets.targetDate):''}. The routes, pipeline and forecast must add up to it.</div>`
        : `<div class="note">Enter the ambition and baseline to lock the growth gap — SO1 action 1.</div>`;
    }
    setText('dash-kpi-ambition', amb>0? gbp(amb,0) : '—');
    setText('dash-kpi-ambition-sub', amb>0? (marketTargets.targetDate? 'By '+esc(marketTargets.targetDate) : 'Target to be locked post-OR2') : 'Set in Market & Targets');
    const cover = (gap!==null && gap>0)? (_dashPipe.tV||0)/gap : null;
    setText('dash-kpi-cover', cover!==null? num(cover,1)+'×' : '—');
    setText('dash-kpi-cover-sub', cover!==null? (cover>=3? 'Meets the 3× rule' : 'Below the 3× rule — build pipeline') : 'Lock the growth gap first');
    if(cover!==null && cover<3) dashAttn.push({sev:'warn', goto:'pipeline', text:`Pipeline coverage is ${num(cover,1)}× the growth gap — the 3× rule needs more named opportunities`});
    let rtSum = 0, rtAny = false;
    products.forEach(p=>{
      const r = results[p.key];
      setText('rt-'+p.key+'-price', r.trueExVat!==null? gbp(r.trueExVat,2) : '—');
      let _rtPlanSessions = 0; (p.fcVolumes||[]).forEach(v=>{ _rtPlanSessions += parseFloat(v)||0; });
      const _rtCur = (r.trueExVat!==null && r.trueExVat>0)? _rtPlanSessions*r.trueExVat : 0;
      setText('rt-'+p.key+'-cur', _rtCur>0? gbp(_rtCur,0) : '—');
      const tgt = parseFloat(p.routeTarget)||0;
      if(tgt>0){ rtSum += tgt; rtAny = true; }
      const vol = (tgt>0 && r.trueExVat>0)? Math.ceil(tgt/r.trueExVat) : null;
      setText('rt-'+p.key+'-vol', vol!==null? num(vol,0)+' '+p.unitPlural : '—');
      const _rtPipe = (_dashPipe.wByProduct||{})[p.key]||0;
      const _rtPipeEl = document.getElementById('rt-'+p.key+'-pipe');
      if(_rtPipeEl){
        if(tgt>0){
          const covPct = _rtPipe/tgt*100;
          _rtPipeEl.innerHTML = gbp(_rtPipe,0)+' <span style="font-size:10.5px; font-weight:700; color:'+(covPct>=100?'var(--good)':(covPct>=33?'var(--warn)':'var(--bad)'))+';">('+num(covPct,0)+'% of target)</span>';
        } else {
          _rtPipeEl.textContent = gbp(_rtPipe,0);
        }
      }
      const hEl = document.getElementById('rt-'+p.key+'-health');
      if(hEl) hEl.innerHTML = marginBadge(r.marginVatPct);
    });
    const rtNote = document.getElementById('rt-note');
    if(rtNote){
      if(rtAny && gap!==null){
        const diff = rtSum - gap;
        rtNote.innerHTML = `<div class="note">Route targets add to <strong>${gbp(rtSum,0)}</strong> against a gap of <strong>${gbp(gap,0)}</strong> — ${Math.abs(diff)<0.5?'exactly on target':(diff>0? gbp(diff,0)+' above the gap' : gbp(Math.abs(diff),0)+' still unallocated across routes')}.</div>`;
      } else if(rtAny){ rtNote.innerHTML = `<div class="note">Route targets add to <strong>${gbp(rtSum,0)}</strong> — lock the growth gap in Market & Targets to compare.</div>`; }
      else rtNote.innerHTML = '<div class="note">Set a growth target per route to see the volume each price implies — SO1 action 3.</div>';
    }
    const oppNoAction = pipeline.filter(o=>!(o.nextAction||'').trim()).length;
    setText('dash-act-accounts', String(accounts.length));
    setText('dash-act-prospects', String(pipeline.length));
    setText('dash-act-proposals', String(pipeline.filter(o=>o.stage==='proposal').length));
    setText('dash-act-noaction', String(noAction + oppNoAction));
    setText('dash-act-renewals', String(watchCount + riskCount));
    const healthyRoutes = products.filter(p=>results[p.key].marginVatPct!==null && results[p.key].marginVatPct>=15).length;
    setText('dash-act-health', healthyRoutes+' of '+products.length);
    if(oppNoAction>0) dashAttn.push({sev:'warn', goto:'pipeline', text:`${oppNoAction} pipeline opportunit${oppNoAction===1?'y has':'ies have'} no next step logged`});
    if(amb===0) dashAttn.push({sev:'warn', goto:'market', text:'Growth target not locked yet — set ambition and baseline in Market & Targets'});
  }


  // ---------- Objective 3: pathway quantification ----------
  {
    // journey conversions + biggest drop-off
    let worstConv=null, worstFrom='', worstTo='';
    for(let i=0;i<journeyStages.length;i++){
      const s = journeyStages[i];
      const el = document.getElementById('jconv-'+s.id);
      if(!el) continue;
      if(i===0){ el.textContent='—'; el.style.color=''; el.style.fontWeight=''; continue; }
      const prev = journeyStages[i-1];
      const cPrev = parseFloat(prev.count), cCur = parseFloat(s.count);
      if(!isNaN(cPrev) && cPrev>0 && !isNaN(cCur)){
        const pct = cCur/cPrev*100;
        el.textContent = num(pct,0)+'%';
        el.style.fontWeight='700';
        el.style.color = pct<50? 'var(--red)' : (pct<80? 'var(--amber)' : 'var(--green)');
        if(worstConv===null || pct<worstConv){ worstConv=pct; worstFrom=prev.stage; worstTo=s.stage; }
      } else { el.textContent='—'; el.style.color=''; el.style.fontWeight=''; }
    }
    const leakEl = document.getElementById('journey-leak');
    if(leakEl){
      leakEl.innerHTML = (worstConv!==null)
        ? `<div class="note" style="border-left-color:var(--red);">Biggest drop-off: <strong>${esc(worstFrom)} → ${esc(worstTo)}</strong> — only ${num(worstConv,0)}% carry through. That's the stage to fix first.</div>`
        : `<div class="note">Add the number of customers reaching each stage to see conversion rates and where the biggest drop-off is.</div>`;
    }

    // product pathway — lifetime value
    const fromTotals = {};
    pathwaySteps.forEach(s=>{
      const conv = parseFloat(s.convPct), val = parseFloat(s.stepValue);
      const va = (!isNaN(conv) && !isNaN(val))? conv/100*val : null;
      setText('pw-value-'+s.id, va!==null? gbp(va,0) : '—');
      if(va!==null){ const key = (s.from||'').trim() || '(unnamed)'; fromTotals[key] = (fromTotals[key]||0) + va; }
    });
    const ltvEl = document.getElementById('pw-ltv-summary');
    if(ltvEl){
      const keys = Object.keys(fromTotals);
      ltvEl.innerHTML = keys.length
        ? '<div class="note" style="border-left-color:var(--green);">'+keys.map(k=>`Each <strong>${esc(k)}</strong> customer generates about <strong>${gbp(fromTotals[k],0)}</strong> in extra downstream value, on top of the entry sale.`).join('<br>')+'</div>'
        : '<div class="note">Add the % that move on and the value of a downstream customer to see what an entry customer is really worth.</div>';
    }
  }

  // ---------- SO2: NI market sizing, Stage 2 pricing/forecast, named prospects ----------
  {
    NI_VALIDATED_ROUTES.forEach(key=>{
      const p = findProduct(key); if(!p) return;
      const r = results[key];
      const ms = niMarketSizing[key];
      const pop = parseFloat(ms.population)||0, share = parseFloat(ms.share)||0, freq = parseFloat(ms.freq)||0;
      const niPrice = (r.roiPrice!==null && r.roiPrice!==undefined) ? r.roiPrice : null;
      const impliedUnits = pop * share/100 * freq;
      const impliedIncome = (niPrice!==null) ? impliedUnits*niPrice : null;
      setText(`ni-implied-${key}`, impliedIncome!==null? eur(impliedIncome,0) : '—');
    });
    const prizeEl = document.getElementById('ni-sizing-vs-prize');
    if(prizeEl){
      const prizeNum = parseFloat(niPrizeTarget);
      prizeEl.textContent = (!isNaN(prizeNum) && prizeNum>0)
        ? `Compare the implied-income rows above against your NI prize of ${eur(prizeNum,0)} to see whether the ambition is bottom-up real.`
        : `Enter a NI prize figure above to compare the implied income against it.`;
    }

    const combinedRev = new Array(12).fill(0), combinedCon = new Array(12).fill(0);
    let combinedRevTot=0, combinedConTot=0;
    NI_VALIDATED_ROUTES.forEach(key=>{
      const p = findProduct(key); if(!p) return;
      const r = results[key];
      const niPrice = (r.roiPrice!==null && r.roiPrice!==undefined) ? r.roiPrice : null;
      const niContrib = r.contributionROI;
      setText(`ni-price-${key}`, niPrice!==null? eur(niPrice,2) : '—');
      setText(`ni-contrib-${key}`, niContrib!==null? eur(niContrib,2) : '—');
      if(!Array.isArray(p.fcVolumesNI)) p.fcVolumesNI = new Array(12).fill(0);
      let unitTot=0, revTot=0, conTot=0;
      for(let m=0;m<12;m++){
        const v = parseFloat(p.fcVolumesNI[m])||0;
        unitTot += v;
        const rev = niPrice!==null? niPrice*v : 0;
        const con = niContrib!==null? niContrib*v : 0;
        revTot += rev; conTot += con;
        combinedRev[m]+=rev; combinedCon[m]+=con;
        setText(`fcni-${key}-rev-${m}`, niPrice!==null? eur(rev,0):'—');
        setText(`fcni-${key}-con-${m}`, niContrib!==null? eur(con,0):'—');
      }
      setText(`fcni-${key}-unittot`, num(unitTot,0));
      setText(`fcni-${key}-revtot`, niPrice!==null? eur(revTot,0):'—');
      setText(`fcni-${key}-contot`, niContrib!==null? eur(conTot,0):'—');
      combinedRevTot+=revTot; combinedConTot+=conTot;
    });
    for(let m=0;m<12;m++){
      setText(`fcni-combined-rev-${m}`, eur(combinedRev[m],0));
      setText(`fcni-combined-con-${m}`, eur(combinedCon[m],0));
    }
    setText('fcni-combined-revtot', eur(combinedRevTot,0));
    setText('fcni-combined-contot', eur(combinedConTot,0));

    const niRowsEl = document.getElementById('ni-prospect-rows');
    if(niRowsEl){
      const niOpps = pipeline.filter(o=>o.market==='ni');
      if(!niOpps.length){
        niRowsEl.innerHTML = '<tr><td colspan="5" class="empty-note">No NI-tagged prospects yet — log one in the Sales pipeline tab and set its Market column to NI.</td></tr>';
      } else {
        const stageLabelsLocal = {}; PIPELINE_STAGES.forEach(s=>stageLabelsLocal[s.key]=s.label);
        niRowsEl.innerHTML = niOpps.map(o=>{
          const val = parseFloat(o.value)||0, prob = parseFloat(o.probability)||0;
          const w = val*prob/100;
          const prodName = (findProduct(o.product)||{name:(o.product==='other'?'Other':o.product)||'—'}).name;
          return `<tr><td>${esc(o.name||'—')}</td><td>${esc(prodName)}</td><td>${esc(stageLabelsLocal[o.stage]||o.stage||'—')}</td><td style="text-align:right;">${eur(val,0)}</td><td style="text-align:right; font-weight:700;">${eur(w,0)}</td></tr>`;
        }).join('');
      }
    }
  }

  // ---------- Dashboard tile badges (Objective tab) ----------
  {
    setBadge('dash-badge-overhead', overheadTotal()>0 ? 'Entered' : 'Not started', overheadTotal()>0 ? 'ok' : 'todo');

    products.forEach(p=>{
      const r = results[p.key];
      const started = (parseFloat(p.unitsPerYear)||0)>0
        || Object.values(p.allocations||{}).some(v=>(parseFloat(v)||0)>0)
        || (p.priceNI!==null && p.priceNI!==undefined && p.priceNI!=='');
      if(r.costFloor!==null && r.priceNI!==null){
        setBadge(`dash-badge-${p.key}`, 'Priced', 'ok');
      } else if(started){
        setBadge(`dash-badge-${p.key}`, 'In progress', 'warn');
      } else {
        setBadge(`dash-badge-${p.key}`, 'Not started', 'todo');
      }
    });

    const costedCount = products.filter(p=>results[p.key].costFloor!==null).length;
    setBadge('dash-badge-floorsummary', `${costedCount}/${products.length} costed`,
      costedCount===products.length ? 'ok' : (costedCount>0 ? 'warn' : 'todo'));

    const reviewedCount = products.filter(p=>p.repriceDecision).length;
    setBadge('dash-badge-stepa', `${reviewedCount}/${products.length} reviewed`,
      reviewedCount===products.length ? 'ok' : (reviewedCount>0 ? 'warn' : 'todo'));

    const pricedCount = products.filter(p=>results[p.key].priceNI!==null).length;
    setBadge('dash-badge-finalprice', `${pricedCount}/${products.length} priced`,
      pricedCount===products.length ? 'ok' : (pricedCount>0 ? 'warn' : 'todo'));

    const realOpps = pipeline.filter(o=>!String(o.name||'').includes('EXAMPLE'));
    if(!pipeline.length){
      setBadge('dash-badge-pipeline', 'Not started', 'todo');
    } else if(!realOpps.length){
      setBadge('dash-badge-pipeline', 'Example only', 'todo');
    } else {
      setBadge('dash-badge-pipeline', `${realOpps.length} prospect${realOpps.length===1?'':'s'}`, 'ok');
    }

    const anyForecastAtAll = products.some(p=>Array.isArray(p.fcVolumes) && p.fcVolumes.some(v=>(parseFloat(v)||0)>0));
    const customForecast = products.some(p=>{
      if(!Array.isArray(p.fcVolumes)) return false;
      const vals = p.fcVolumes.map(v=>parseFloat(v)||0);
      if(p.key==='nursinghomes') return JSON.stringify(vals)!==JSON.stringify(NH_EXAMPLE_VOLUMES);
      return vals.some(v=>v>0);
    });
    if(!anyForecastAtAll){
      setBadge('dash-badge-forecast', 'Not started', 'todo');
    } else if(!customForecast){
      setBadge('dash-badge-forecast', 'Example only', 'todo');
    } else {
      setBadge('dash-badge-forecast', 'In progress', 'ok');
    }

    const journeyHasExample = journeyStages.some(s=>String(s.count||'').includes('EXAMPLE'));
    const pathwayHasExample = pathwaySteps.some(s=>String(s.note||'').includes('EXAMPLE'));
    if(!journeyStages.length && !pathwaySteps.length){
      setBadge('dash-badge-pathway', 'Not started', 'todo');
    } else if(journeyHasExample || pathwayHasExample){
      setBadge('dash-badge-pathway', 'Uses example data', 'warn');
    } else {
      setBadge('dash-badge-pathway', 'Customised', 'ok');
    }

    const so2Done = SO2_CHECKLIST_ITEMS.filter(i=>so2ChecklistState[i.key]).length;
    setBadge('dash-badge-so2', `${so2Done}/${SO2_CHECKLIST_ITEMS.length} checklist`,
      so2Done===SO2_CHECKLIST_ITEMS.length ? 'ok' : (so2Done>0 ? 'warn' : 'todo'));

    // highlight next step
    document.querySelectorAll('.dash-card').forEach(dc=>dc.classList.remove('dash-next'));
    const _badgeOrder = ['overhead',...PRODUCT_TABS.map(t=>t.key),'floorsummary','stepa','finalprice','pipeline','forecast','pathway','so2'];
    let _nextKey = null;
    for(const k of _badgeOrder){
      const badge = document.getElementById('dash-badge-'+k);
      if(badge && !badge.classList.contains('ok')){ _nextKey = k; break; }
    }
    const _hintEl = document.getElementById('dash-next-hint');
    if(_nextKey){
      const _card = document.querySelector('.dash-card[data-goto="'+_nextKey+'"]');
      if(_card) _card.classList.add('dash-next');
      if(_hintEl){
        const _titleEl = _card ? _card.querySelector('.dash-card-title') : null;
        const _label = _titleEl ? _titleEl.textContent : _nextKey;
        _hintEl.textContent = 'Next step → ' + _label;
      }
    } else if(_hintEl){
      _hintEl.textContent = 'All sections complete — review and export.';
    }
  }

  // keep every exchange-rate box in sync (Summary tab + Cost floor summary tab)
  document.querySelectorAll('input[data-action="fxrate"]').forEach(inp=>{
    if(document.activeElement !== inp) inp.value = exchangeRate;
  });

  const attnEl = document.getElementById('dash-attention');
  if(attnEl){
    attnEl.innerHTML = dashAttn.length
      ? dashAttn.map(a=>`<button type="button" class="dash-card attn-item" data-goto="${a.goto}"><span class="attn-dot ${a.sev}"></span><span>${a.text}</span></button>`).join('')
      : `<div class="empty-note">Nothing needs attention right now — nice work.</div>`;
  }

  if(_initComplete && typeof saveStateToLocalStorage === 'function') saveStateToLocalStorage();
}
function setText(id, text){ const el=document.getElementById(id); if(el) el.textContent=text; }
function setBadge(id, label, cls){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = label;
  el.className = 'badge ' + cls;
}
// Set the value of every matching control except the one currently being edited (keeps duplicated controls in sync).
function syncInputs(selector, value){
  document.querySelectorAll(selector).forEach(el=>{ if(document.activeElement!==el && String(el.value)!==String(value)) el.value = value; });
}

function findProduct(key){ return products.find(p=>p.key===key); }

document.addEventListener('input', e=>{

document.addEventListener('click', e=>{
  // Direct-labour radio: clicking the already-selected line clears it (radios can't otherwise be un-ticked).
  const radio = e.target.closest('input[type=radio][data-action="directline"]');
  if(radio){
    const prod = findProduct(radio.dataset.product);
    if(prod && prod.directLine === radio.value){
      prod.directLine = null;
      radio.checked = false;
      updateAll();
    }
    return;
  }

  // Dashboard tile: jump to the matching tab, same as clicking it in the nav bar.
  const dashCard = e.target.closest('.dash-card[data-goto]');
  if(dashCard){
    const key = dashCard.dataset.goto;
    const navBtn = document.querySelector(`nav.tabs button[data-tab="${key}"]`);
    if(navBtn){
      const pt=document.getElementById('pageTitle'); if(pt) pt.textContent=navBtn.textContent.replace(/^\d+\s*/,'');
      document.querySelectorAll('nav.tabs button[data-tab]').forEach(b=>b.classList.toggle('active', b===navBtn));
      document.querySelectorAll('.tabpanel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+key));
      const grp = navBtn.closest('.navgroup'); if(grp) grp.classList.add('open');
      navBtn.scrollIntoView({block:'nearest', inline:'nearest'});
    }
    return;
  }

  const t = e.target.closest('button[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  if(action==='addcompetitor'){
    const prod = t.dataset.prod, market = t.dataset.market;
    competitorData[prod][market].list.push({id: nextCompetitorId(), type:'direct', name:'', offer:'', price:'', source:''});
    renderCompetitorMarket(prod, market);
    updateAll();
    if(_initComplete) saveStateToLocalStorage();
  } else if(action==='removecompetitor'){
    const prod = t.dataset.prod, market = t.dataset.market, id = t.dataset.id;
    competitorData[prod][market].list = competitorData[prod][market].list.filter(entry=>entry.id!==id);
    renderCompetitorMarket(prod, market);
    updateAll();
    if(_initComplete) saveStateToLocalStorage();
  } else if(action==='addjourney'){
    journeyStages.push({id:nextPathwayId(), stage:'', what:'', owner:'', timing:'', dropoff:''});
    renderJourney(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='removejourney'){
    journeyStages = journeyStages.filter(x=>x.id!==t.dataset.id);
    renderJourney(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='addpathway'){
    pathwaySteps.push({id:nextPathwayId(), from:'', to:'', trigger:'', note:''});
    renderPathway(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='removepathway'){
    pathwaySteps = pathwaySteps.filter(x=>x.id!==t.dataset.id);
    renderPathway(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='loadexample'){
    loadExampleData();
  } else if(action==='addpipeline'){
    pipeline.push({id:nextPipelineId(), product:products[0].key, name:'', source:'', stage:'lead', value:'', probability:10, closeMonth:'', nextAction:'', owner:'', market:'roi'});
    renderPipeline(); updateAll(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='removepipeline'){
    pipeline = pipeline.filter(x=>x.id!==t.dataset.id);
    renderPipeline(); updateAll(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='addaccount'){
    accounts.push({id:nextAccountId(), name:'', type:ACCOUNT_TYPES[1], geography:'', potential:'', relationship:'cold', nextAction:'', owner:''});
    renderAccounts(); updateAll(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='removeaccount'){
    accounts = accounts.filter(x=>x.id!==t.dataset.id);
    renderAccounts(); updateAll(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='addcontract'){
    contracts.push({id:nextContractId(), account:'', product:products[0].key, annualValue:'', renewalDate:'', health:'healthy', action:''});
    renderContracts(); updateAll(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='removecontract'){
    contracts = contracts.filter(x=>x.id!==t.dataset.id);
    renderContracts(); updateAll(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='addopportunity'){
    pipeline.push({id:nextPipelineId(), product:products[0].key, name:'', source:'', stage:'lead', value:'', probability:10, closeMonth:'', nextAction:'', owner:'', market:'roi'});
    renderPipeline(); updateAll(); if(_initComplete) saveStateToLocalStorage();
    const navBtn = document.querySelector('nav.tabs button[data-tab="pipeline"]');
    if(navBtn) navBtn.click();
  } else if(action==='addoverhead'){
    const key = 'custom' + (overheadLineCounter++);
    OVERHEAD_LINES.push({key:key, label:'', short:'', custom:true});
    overhead[key] = 0;
    products.forEach(p=>{ if(!p.allocations) p.allocations = {}; p.allocations[key] = 0; });
    rebuildPreservingTab();
    if(_initComplete) saveStateToLocalStorage();
    const inp = document.querySelector('input[data-action="overheadlabel"][data-line="'+key+'"]');
    if(inp) inp.focus();
  } else if(action==='addborder'){
    borderRelationships.push({id:nextBorderId(), contact:'', org:'', type:'', status:'', nextAction:''});
    renderBorder(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='removeborder'){
    borderRelationships = borderRelationships.filter(x=>x.id!==t.dataset.id);
    renderBorder(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='addpersona'){
    personas.push({id:nextPersonaId(), ageBand:'', buyer:'', need:'', message:'', routes:''});
    renderPersonas(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='removepersona'){
    personas = personas.filter(x=>x.id!==t.dataset.id);
    renderPersonas(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='addactivity'){
    marketingActivities.push({id:nextActivityId(), activity:'', route:'', target:'', owner:'', when:'', status:'Planned'});
    renderActivities(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='removeactivity'){
    marketingActivities = marketingActivities.filter(x=>x.id!==t.dataset.id);
    renderActivities(); if(_initComplete) saveStateToLocalStorage();
  } else if(action==='removeoverhead'){
    const key = t.dataset.line;
    const idx = OVERHEAD_LINES.findIndex(x=>x.key===key);
    if(idx>-1){
      OVERHEAD_LINES.splice(idx,1);
      delete overhead[key];
      products.forEach(p=>{
        if(p.allocations) delete p.allocations[key];
        if(p.directLine===key) p.directLine = null;
      });
      rebuildPreservingTab();
      if(_initComplete) saveStateToLocalStorage();
    }
  }
});
