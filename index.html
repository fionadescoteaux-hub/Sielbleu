<style>

}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:#eee}
button,input,select{font:inherit}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.sidebar{background:var(--nav);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}

.nav{margin-top:14px}.nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:#e9e2e6;padding:10px 11px;border-radius:7px;text-align:left;cursor:pointer;margin:2px 0;font-size:13px}.nav button:hover,.nav button.active{background:#5b3a50;color:#fff}.nav .num{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid #8f7383;border-radius:5px;font-size:11px}
.main{min-width:0}.topbar{background:#fff;border-bottom:1px solid var(--line);padding:15px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.topbar h1{font-size:18px;margin:0}.topbar .sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 11px;font-size:12px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.content{padding:18px 22px 44px;max-width:1600px;margin:auto}.notice{background:#fff7e6;border:1px solid #e5c88c;color:#6e4d14;border-radius:7px;padding:10px 13px;font-size:12px;margin-bottom:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filter{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:12px}.filter label{color:var(--muted);margin-right:5px}.filter select{border:0;background:transparent;font-weight:600;outline:none}
.page{display:none}.page.active{display:block}.page-head{display:flex;align-items:end;justify-content:space-between;margin:6px 0 13px}.page-head h2{margin:0;font-size:22px}.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.tag{font-size:11px;border-radius:20px;padding:5px 8px;background:#f1e7ec;color:var(--accent);font-weight:700}
.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(6,minmax(145px,1fr));margin-bottom:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.kpi .value{font-size:23px;font-weight:750;margin:7px 0 4px}.kpi .delta{font-size:11px;color:var(--muted)}.good{color:var(--good)!important}.warn{color:var(--warn)!important}.bad{color:var(--bad)!important}
.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:1.3fr 1fr 1fr}.split{display:grid;grid-template-columns:1fr 360px;gap:12px}.section-title{font-size:14px;font-weight:750;margin:0 0 10px}.helper{font-size:11px;color:var(--muted);margin-top:-5px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);padding:8px 7px}td{padding:9px 7px;border-bottom:1px solid #eee;vertical-align:top}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 7px;font-size:10px;background:#fafafa}.pill.accent{background:#f2e5eb;color:var(--accent);border-color:#dfc0cf}.pill.green{background:#e8f2ed;color:var(--good);border-color:#bdd8ca}.pill.amber{background:#fff1d9;color:#7b5417;border-color:#efd19b}.pill.red{background:#f9e7e7;color:#8b2f2f;border-color:#ebc2c2}
.bar{height:8px;background:#eee;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent);border-radius:8px}.metric-row{display:grid;grid-template-columns:135px 1fr 54px;gap:8px;align-items:center;font-size:11px;margin:9px 0}.callout{border-left:4px solid var(--accent);background:#faf6f8;padding:10px 12px;font-size:12px;margin:10px 0}.alert{display:flex;gap:9px;padding:9px;border-bottom:1px solid #eee;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);margin-top:3px;flex:0 0 auto}.dot.bad{background:var(--bad)}.dot.good{background:var(--good)}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:9px;overflow-x:auto;padding-bottom:5px}.lane{background:#f4f1f3;border:1px solid var(--line);border-radius:8px;padding:9px;min-height:430px}.lane h4{font-size:11px;text-transform:uppercase;margin:1px 0 9px;color:#5f565e;display:flex;justify-content:space-between}.deal{background:#fff;border:1px solid #ded7db;border-radius:7px;padding:9px;margin-bottom:8px;box-shadow:0 1px 0 rgba(0,0,0,.03)}.deal b{font-size:12px}.deal small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.deal .amount{font-weight:750;margin-top:7px;font-size:13px}.deal .meta{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px;background:#fff}.calc{background:#2f2730;color:#fff;border-radius:8px;padding:14px}.calc .big{font-size:28px;font-weight:800;margin:7px 0}.calc-row{display:flex;justify-content:space-between;border-top:1px solid #5e5260;padding:8px 0;font-size:12px}
.flow{display:flex;gap:7px;align-items:center;overflow:auto;padding:8px 0}.step{min-width:130px;padding:10px;border:1px solid var(--line);background:#fff;border-radius:7px;text-align:center;font-size:11px}.arrow{color:#887b83}.step.active{border:2px solid var(--accent);background:#fbf5f8}.step.done{background:#eaf3ee;border-color:#b9d5c5}
.stagegate{display:grid;grid-template-columns:220px 1fr 150px 120px;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}.stagegate>div{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}.stagegate .head{background:#f0ecee;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:700}.stagegate .full{grid-column:1/-1;background:#faf7f8;font-weight:700}
.schema{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.entity{border:1px solid var(--line);border-radius:7px;background:#fff;padding:10px 12px;min-width:140px}.entity b{display:block;font-size:12px}.entity span{font-size:10px;color:var(--muted)}
.checks{columns:2;column-gap:24px}.check{break-inside:avoid;font-size:12px;margin:8px 0}.check:before{content:'□';margin-right:7px;color:var(--accent);font-weight:bold}
.legend{font-size:10px;color:var(--muted);margin-top:8px}.wire{border:1px dashed #999;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 8px,#f5f5f5 8px,#f5f5f5 16px);min-height:150px;display:grid;place-items:center;color:#777;font-size:12px;border-radius:7px}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(3,1fr)}.two,.three,.split{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr 1fr}.stagegate{grid-template-columns:1fr 1fr}.stagegate .full{grid-column:1/-1}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.nav{display:grid;grid-template-columns:1fr 1fr}.topbar{position:relative}.kpis{grid-template-columns:1fr 1fr}.content{padding:14px}.actions{display:none}.form-grid{grid-template-columns:1fr}.checks{columns:1}}

/* Siel Bleu Ireland branded visual system */
:root{
  --brand-blue:#78e8ff;
  --brand-blue-deep:#26b9dc;
  --brand-yellow:#fabc2b;
  --brand-yellow-deep:#f6a925;
  --brand-navy:#102d3b;
  --brand-navy-2:#173f50;
  --brand-mist:#eefbfe;
  --ink:#17313d;
  --muted:#647985;
  --line:#d4e8ed;
  --soft:#f1fafc;
  --panel:#ffffff;
  --accent:var(--brand-blue-deep);
  --accent2:var(--brand-yellow);
  --nav:var(--brand-navy);
  --good:#19865f;
  --warn:#b36b00;
  --bad:#b9404c;
}
body{background:linear-gradient(135deg,#f7fdff 0%,#edf9fc 48%,#fffaf0 100%);}
.sidebar{background:linear-gradient(180deg,var(--brand-navy) 0%,#0b2330 100%);padding:22px 15px;box-shadow:8px 0 30px rgba(16,45,59,.12)}
.brand{padding:4px 10px 22px;border-bottom:1px solid rgba(120,232,255,.2)}
.brand-logo{display:block;width:172px;max-width:100%;height:auto;margin:0 0 15px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.18))}
.brand-product{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.01em;margin-bottom:5px}
.brand span{font-size:11px;color:#b9d9e3;line-height:1.5}
.brand-chip{display:inline-flex;margin-top:12px;padding:5px 8px;border-radius:999px;background:rgba(250,188,43,.14);border:1px solid rgba(250,188,43,.45);color:var(--brand-yellow);font-size:9px;font-weight:800;letter-spacing:.08em}
.nav{margin-top:17px}.nav button{color:#d8edf3;border:1px solid transparent;padding:11px 10px;border-radius:10px}.nav button:hover{background:rgba(120,232,255,.08);border-color:rgba(120,232,255,.18)}.nav button.active{background:linear-gradient(90deg,rgba(120,232,255,.2),rgba(120,232,255,.08));border-color:rgba(120,232,255,.34);color:#fff;box-shadow:inset 3px 0 0 var(--brand-yellow)}.nav .num{border-color:rgba(120,232,255,.36);color:var(--brand-blue);background:rgba(120,232,255,.06)}.nav button.active .num{background:var(--brand-blue);color:var(--brand-navy);border-color:var(--brand-blue)}
.topbar{padding:14px 24px;border-bottom:1px solid var(--line);box-shadow:0 3px 18px rgba(16,45,59,.06)}.topbar-title{display:flex;flex-direction:column}.topbar-kicker{font-size:9px;font-weight:900;letter-spacing:.16em;color:var(--brand-blue-deep);margin-bottom:3px}.topbar h1{font-size:19px;color:var(--brand-navy)}
.btn{border-color:#c8e0e6;border-radius:9px;color:var(--brand-navy);font-weight:700}.btn:hover{border-color:var(--brand-blue-deep);background:var(--brand-mist)}.btn.primary{background:linear-gradient(135deg,var(--brand-yellow),var(--brand-yellow-deep));color:var(--brand-navy);border-color:var(--brand-yellow-deep);box-shadow:0 6px 14px rgba(250,188,43,.2)}
.content{padding:22px 24px 48px}.notice{background:linear-gradient(90deg,#fff8e6,#fffdf6);border-color:#f3d27c;color:#6e5310;border-radius:12px;box-shadow:0 5px 16px rgba(250,188,43,.08)}
.filter{border-color:var(--line);border-radius:9px;box-shadow:0 2px 9px rgba(16,45,59,.04)}
.page-head h2{color:var(--brand-navy);font-size:24px;letter-spacing:-.025em}.tag{background:#dcf8ff;color:#087a9a;border:1px solid #b7ecf7}
.card{border-color:var(--line);border-radius:14px;box-shadow:0 7px 24px rgba(16,45,59,.055)}.card:hover{box-shadow:0 9px 28px rgba(16,45,59,.075)}
.kpi{position:relative;overflow:hidden}.kpi:before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand-blue),var(--brand-yellow))}.kpi .value{color:var(--brand-navy);letter-spacing:-.03em}
th{color:#55717f;background:#f7fcfd}td{border-bottom-color:#e9f2f4}
.pill.accent{background:#dff9ff;color:#087a9a;border-color:#afeaf6}.pill.green{background:#e7f7f0}.pill.amber{background:#fff6da}.pill.red{background:#fff0f1}
.bar{background:#e7f2f5}.bar span{background:linear-gradient(90deg,var(--brand-blue-deep),var(--brand-blue))}
.callout{border-left-color:var(--brand-blue-deep);background:linear-gradient(90deg,#eafaff,#f8fdff)}
.dot{background:var(--brand-yellow-deep)}
.lane{background:#f2fafc;border-color:#d8eaef}.lane h4{color:#3b6778}.deal{border-color:#d8eaef;border-top:3px solid var(--brand-blue)}
.calc{background:linear-gradient(160deg,var(--brand-navy),var(--brand-navy-2));box-shadow:0 12px 30px rgba(16,45,59,.18)}.calc .big{color:var(--brand-yellow)}.calc-row{border-top-color:rgba(120,232,255,.18)}
.step.active{border-color:var(--brand-blue-deep);background:#e9fbff;box-shadow:0 4px 12px rgba(38,185,220,.12)}.step.done{background:#fff7dc;border-color:#f3d36e}.arrow{color:var(--brand-blue-deep)}
.stagegate .head{background:var(--brand-navy);color:#fff}.stagegate .full{background:#fff8df;border-left:4px solid var(--brand-yellow-deep)}
.entity{border-color:#cce5eb;background:linear-gradient(180deg,#fff,#f8fdff)}.entity b{color:var(--brand-navy)}
.check:before{color:var(--brand-blue-deep)}
.wire{border-color:#8fcfdd;background:repeating-linear-gradient(45deg,#f8fdff,#f8fdff 8px,#edf9fc 8px,#edf9fc 16px);color:#47707f}
.brand-footer{margin-top:20px;padding:14px;border-radius:12px;background:rgba(120,232,255,.08);border:1px solid rgba(120,232,255,.2);font-size:10px;color:#bcdbe4;line-height:1.5}.brand-footer b{color:var(--brand-yellow)}
@media(max-width:760px){.brand-logo{width:145px}.sidebar{padding:16px 12px}.brand{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}.brand-product,.brand span,.brand-chip{grid-column:2}.brand-logo{grid-row:1/4}.nav{margin-top:10px}.content{padding:15px}}


/* ===== engine compatibility layer ===== */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
:root{
  --plum:var(--brand-navy); --plum-dark:#0b2330; --magenta:var(--brand-blue-deep);
  --blush:var(--soft); --blush2:#e3f2f6; --ink-soft:var(--muted);
  --green:var(--good); --amber:var(--warn); --red:var(--bad);
  --green-bg:#e7f7f0; --amber-bg:#fff6da; --red-bg:#fff0f1;
  --yellow:var(--brand-yellow);
  --serif:Inter,Arial,sans-serif; --sans:Inter,Arial,sans-serif;
}
.tabpanel{display:none}.tabpanel.active{display:block}
.nav button.subtab{padding:7px 10px 7px 44px;font-size:12px;opacity:.94}
.tab-sep{display:block;margin:15px 10px 5px;font-size:9px;font-weight:900;letter-spacing:.14em;color:#7fb2c4;text-transform:uppercase}
.navgroup-items{display:none}
.navgroup.open .navgroup-items{display:block}
.nav .caret{margin-left:auto;font-size:10px;opacity:.75;transition:transform .15s;flex:0 0 auto}
.navgroup.open .caret{transform:rotate(90deg)}
.navgroup.open button.grouphead{background:rgba(120,232,255,.06)}
.card{margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 5px;color:var(--brand-navy);letter-spacing:-.01em}
.sub{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5}
input[type=number],input[type=text]{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;background:#fff;color:var(--ink)}
input[type=number]:focus,input[type=text]:focus{outline:2px solid var(--brand-blue-deep);outline-offset:1px}
select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink)}
textarea{width:100%;font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:8px;min-height:56px;resize:vertical;background:#fff;color:var(--ink)}
.num-cell{width:78px}.pct-input{width:64px;text-align:right}.money-input{width:88px;text-align:right}.radio-cell{text-align:center;width:56px}
input[type=radio],input[type=checkbox]{accent-color:var(--brand-blue-deep);width:15px;height:15px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.stat .val{font-size:19px;color:var(--brand-navy);font-weight:800;margin-top:3px}
.stat .exact{font-size:11px;color:var(--muted)}
.fieldrow{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 4px}
.fieldrow .field{flex:1;min-width:150px}
.field .hint{font-size:11px;color:var(--muted);text-transform:none;letter-spacing:0;margin-top:4px;display:block}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge.ok{background:#e7f7f0;color:var(--good)}.badge.bad{background:#fff0f1;color:var(--bad)}.badge.warn{background:#fff6da;color:var(--warn)}.badge.todo{background:var(--soft);color:var(--muted)}
.gauge-wrap{margin:18px 0 8px}.gauge-track{position:relative;height:24px;background:#e7f2f5;border-radius:6px;margin-top:20px}
.gauge-fill{position:absolute;top:0;left:0;height:100%;border-radius:6px 0 0 6px;transition:width .15s}
.gauge-fill.ok{background:var(--good)}.gauge-fill.bad{background:var(--bad)}
.gauge-floor-tick{position:absolute;top:-16px;width:2px;height:40px;background:var(--brand-navy)}
.gauge-floor-label{position:absolute;top:-32px;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--brand-navy);white-space:nowrap}
.gauge-price-label{position:absolute;top:5px;left:8px;font-size:11px;font-weight:700;color:#fff}
.divider{border:none;border-top:1px solid var(--line);margin:16px 0}
details.roi{border:1px dashed var(--line);border-radius:10px;padding:2px 14px 14px;margin-top:14px;background:var(--soft)}
details.roi summary{cursor:pointer;font-weight:700;color:var(--brand-navy);padding:11px 0;font-size:13px}
details.roi h4{font-size:13px;color:var(--brand-navy);margin:16px 0 6px}
.check-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:8px 0}
.note{font-size:11.5px;color:#3c606f;background:linear-gradient(90deg,#eafaff,#f8fdff);border-left:3px solid var(--brand-blue-deep);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;line-height:1.5}
body.hide-notes .note{display:none}
.qcard{margin-bottom:13px}.qcard .q{font-weight:700;font-size:12.5px}.qcard .why{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.toolbar button{font:inherit;font-size:11.5px;font-weight:700;color:var(--brand-navy);background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}
.toolbar button:hover{border-color:var(--brand-blue-deep);background:var(--brand-mist)}
.summary-table{overflow-x:auto}
.budgetstrip{margin-bottom:14px}
.budgetstrip-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin-bottom:7px}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 11px;min-width:90px}
.chip-label{font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:800}
.chip-val{font-size:14px;font-weight:800;color:var(--ink);margin-top:1px}
.competitor-market{margin:10px 0}
.competitor-market-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.competitor-market-head h3{font-size:13.5px;color:var(--brand-navy);margin:0}
.add-btn{font:inherit;font-size:11.5px;font-weight:800;color:var(--brand-navy);background:linear-gradient(135deg,var(--brand-yellow),var(--brand-yellow-deep));border:none;border-radius:8px;padding:7px 13px;cursor:pointer;box-shadow:0 4px 10px rgba(250,188,43,.18)}
.remove-btn{font:inherit;font-size:14px;font-weight:700;color:var(--bad);background:none;border:none;cursor:pointer;padding:2px 6px;line-height:1}
.load-btn{font:inherit;font-size:12px;font-weight:800;color:#fff;background:var(--brand-blue-deep);border:none;border-radius:8px;padding:7px 14px;cursor:pointer}
.empty-note{font-size:12px;color:var(--muted);font-style:italic;margin:0}
.competitor-table th{font-size:9.5px}
.dash-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:6px 0 10px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dash-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;cursor:pointer;text-align:left;font:inherit;transition:box-shadow .15s,border-color .15s}
.dash-card:hover{border-color:var(--brand-blue-deep);box-shadow:0 6px 16px rgba(38,185,220,.14)}
.dash-card-title{font-size:12.5px;color:var(--brand-navy);font-weight:800;margin-bottom:8px;line-height:1.3}
.dash-card-desc{font-size:10.5px;color:var(--muted);margin-bottom:6px;line-height:1.4}
.dash-card-wide{grid-column:1/span 3}
.dash-next{border-color:var(--brand-yellow-deep) !important;box-shadow:0 0 0 2px rgba(250,188,43,.35) !important}
.dash-next-hint{font-size:12px;color:var(--brand-blue-deep);font-weight:800;margin:2px 0 10px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 4px}
.kpi-row .kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.kpi-row .kpi:before{content:'';position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand-blue),var(--brand-yellow))}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.kpi-val{font-size:22px;font-weight:800;color:var(--brand-navy);margin-top:6px;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.dash-attention{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.attn-item{display:flex;align-items:flex-start;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:12.5px;color:var(--ink);cursor:pointer;font:inherit;width:100%}
.attn-item:hover{border-color:var(--brand-blue-deep);background:var(--brand-mist)}
.attn-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 auto}
.attn-dot.bad{background:var(--bad)}.attn-dot.warn{background:var(--brand-yellow-deep)}
.note-toggle{font-size:10px;color:#bcdbe4;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none;margin-top:6px}
.lane{min-height:220px}
.oh-label-input{width:100%}
@media(max-width:760px){.actions{display:flex !important;flex-wrap:wrap;gap:6px}}
@media(max-width:640px){.statgrid{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:repeat(2,1fr)}.dash-card-wide{grid-column:1/span 2}}
@media print{.sidebar,.topbar{display:none !important}.app{display:block !important}.tabpanel{display:block !important;margin-bottom:28px}body{background:#fff}.card{break-inside:avoid;box-shadow:none}.toolbar{display:none !important}}
</style>
</head>

// Pull all numbers out of a free-text price (e.g. "€70–€90" -> [70,90]) for the auto price range.
function parsePriceNums(str){
  if(str===null || str===undefined) return [];
  const matches = String(str).match(/\d+(?:[.,]\d+)?/g);
  if(!matches) return [];
  return matches.map(m=>parseFloat(m.replace(/,/g,''))).filter(n=>!isNaN(n));
}

function gbp(n, dec){
  if(n===null || n===undefined || isNaN(n)) return '—';
  dec = dec===undefined?0:dec;
  return '€' + n.toLocaleString('en-GB',{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function eur(n, dec){
  if(n===null || n===undefined || isNaN(n)) return '—';
  dec = dec===undefined?0:dec;
  return '£' + n.toLocaleString('en-GB',{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function num(n, dec){
  if(n===null || n===undefined || isNaN(n)) return '—';
  dec = dec===undefined?0:dec;
  return n.toLocaleString('en-GB',{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
// Internal keys stay 'ni'/'roi' throughout the codebase (unchanged from the original template),
// but for Siel Bleu the PRIMARY market is ROI (euro) and the SECONDARY/validate market is NI
// (sterling) — the reverse of the template's original NI-primary client. This helper maps the
// internal key to the correct on-screen label; use it everywhere a market key was previously
// displayed via .toUpperCase().
function mktLabel(mkt){ return mkt==='ni' ? 'ROI' : 'NI'; }
// Escape user-entered text (overhead line names, direct-labour notes) before putting it into HTML/attributes.
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function overheadTotal(){
  return OVERHEAD_LINES.reduce((s,l)=>s+(parseFloat(overhead[l.key])||0),0);
}

// Margin health badge for the VAT/reconciliation view.
function marginBadge(marginPct){
  if(marginPct===null || marginPct===undefined || isNaN(marginPct)) return '<span class="badge warn">Set a price to check</span>';
  if(marginPct<0) return `<span class="badge bad">Below floor — losing ${num(Math.abs(marginPct),1)}%</span>`;
  if(marginPct<15) return `<span class="badge warn">Thin margin, ${num(marginPct,1)}%</span>`;
  return `<span class="badge ok">Healthy, ${num(marginPct,1)}%</span>`;
}

function computeProduct(p){
  const allocated = {};
  let totalAllocated = 0;
  OVERHEAD_LINES.forEach(l=>{
    const pct = parseFloat(p.allocations[l.key])||0;
    const amt = (parseFloat(overhead[l.key])||0) * pct/100;
    allocated[l.key] = amt;
    totalAllocated += amt;
  });
  const directLabourAnnual = p.directLine ? (allocated[p.directLine]||0) : 0;
  const overheadAnnual = totalAllocated - directLabourAnnual;
  const units = parseFloat(p.unitsPerYear)||0;
  const materials = parseFloat(p.materialsPerUnit)||0;
  // Outsourced products (none for Siel Bleu currently) would carry a per-unit royalty/licence fee as direct cost too.
  const royalty = p.outsourced ? (parseFloat(p.royaltyPerUnit)||0) : 0;
  const directPerUnit = units>0 ? (directLabourAnnual/units + materials + royalty) : null;
  const overheadPerUnit = units>0 ? (overheadAnnual/units) : null;
  const costFloor = (directPerUnit!==null && overheadPerUnit!==null) ? (directPerUnit+overheadPerUnit) : null;

  // capacity threshold / step-fixed cost: past a volume point, a "fixed" line stops being fixed
  const capacityThreshold = parseFloat(p.capacityThreshold)||0;
  const stepCost = parseFloat(p.stepCost)||0;
  const thresholdCrossed = capacityThreshold>0 && units>capacityThreshold;
  const effectiveOverheadAnnual = overheadAnnual + (thresholdCrossed? stepCost : 0);

  const priceNI = p.priceNI===null || p.priceNI===undefined || p.priceNI===''? null : parseFloat(p.priceNI);
  const gapNI = (costFloor!==null && priceNI!==null) ? (priceNI-costFloor) : null;
  const contributionNI = (directPerUnit!==null && priceNI!==null) ? (priceNI-directPerUnit) : null;

  // VAT reconciliation: split the entered price into true ex-VAT + VAT, and check margin vs floor.
  const vatRate = parseFloat(p.vatRate)||0;
  const priceBasis = p.priceBasis==='inc' ? 'inc' : 'ex';
  let trueExVat = null, vatAmount = null, priceIncVat = null;
  if(priceNI!==null){
    trueExVat = priceBasis==='inc' ? priceNI/(1+vatRate/100) : priceNI;
    vatAmount = trueExVat*vatRate/100;
    priceIncVat = trueExVat + vatAmount;
  }
  const marginVat = (costFloor!==null && trueExVat!==null) ? (trueExVat - costFloor) : null;
  const marginVatPct = (marginVat!==null && trueExVat>0) ? (marginVat/trueExVat*100) : null;
  const profitTarget = parseFloat(p.profitTarget)||0;
  let breakEvenNI = null, profitTargetSalesNI = null;
  if(contributionNI!==null && contributionNI>0){
    breakEvenNI = Math.ceil(effectiveOverheadAnnual/contributionNI);
    profitTargetSalesNI = Math.ceil((effectiveOverheadAnnual+profitTarget)/contributionNI);
  }
  let surplusNI = null;
  if(breakEvenNI!==null && units>0){
    surplusNI = units - breakEvenNI;
  }

  // NI (same cost base, £ price, indicative only)
  const roiPrice = p.roiPrice===null || p.roiPrice===undefined || p.roiPrice===''? null : parseFloat(p.roiPrice);
  const contributionROI = (directPerUnit!==null && roiPrice!==null) ? (roiPrice-directPerUnit) : null;
  let breakEvenROI = null;
  if(contributionROI!==null && contributionROI>0){
    breakEvenROI = Math.ceil(effectiveOverheadAnnual/contributionROI);
  }

  // price scenario — her own volume estimate at an alternative price, not a modelled elasticity curve
  const altPrice = p.altPrice===null || p.altPrice===undefined || p.altPrice===''? null : parseFloat(p.altPrice);
  const altVolume = p.altVolume===null || p.altVolume===undefined || p.altVolume===''? null : parseFloat(p.altVolume);
  let altContribution = null, altAnnualContribution = null, altBreakEven = null, altSurplus = null;
  if(altPrice!==null && directPerUnit!==null){
    altContribution = altPrice - directPerUnit;
    if(altContribution>0){
      altBreakEven = Math.ceil(effectiveOverheadAnnual/altContribution);
      if(altVolume!==null){
        altAnnualContribution = altContribution*altVolume;
        altSurplus = altVolume - altBreakEven;
      }
    }
  }

  return {allocated, totalAllocated, directLabourAnnual, overheadAnnual, units, directPerUnit, overheadPerUnit,
          costFloor, priceNI, gapNI, contributionNI, breakEvenNI, profitTargetSalesNI, surplusNI,
          roiPrice, contributionROI, breakEvenROI,
          capacityThreshold, stepCost, thresholdCrossed, effectiveOverheadAnnual,
          altPrice, altVolume, altContribution, altAnnualContribution, altBreakEven, altSurplus,
          royalty, vatRate, priceBasis, trueExVat, vatAmount, priceIncVat, marginVat, marginVatPct};
}

function outcomeLineHTML(label, rr, price, curr){
  const prefix = label? `<strong>${label}:</strong> ` : '';
  if(rr.costFloor===null || rr.directPerUnit===null){
    return prefix + '<span style="color:var(--ink-soft);">set units/year first to see the outcome</span>';
  }
  const gap = price - rr.costFloor;
  const contribution = price - rr.directPerUnit;
  const gapColor = gap>=0? 'var(--green)':'var(--red)';
  const gapText = gap>=0
    ? `+${curr}${num(gap,2)} above floor`
    : `${curr}${num(Math.abs(gap),2)} below floor`;
  let contribText;
  if(contribution<=0){
    contribText = `<span style="color:var(--red); font-weight:700;">loses ${curr}${num(Math.abs(contribution),2)} every sale</span>`;
  } else {
    const breakEven = Math.ceil(rr.effectiveOverheadAnnual/contribution);
    contribText = `contribution ${curr}${num(contribution,2)} · break-even ${num(breakEven,0)} sales`;
  }
  return `${prefix}<span style="color:${gapColor}; font-weight:700;">${gapText}</span> · ${contribText}`;
}

// Recomputes contribution/break-even/annual-contribution/surplus with one or more inputs
// overridden — used to flex overhead, price, or volume independently for the sensitivity tables.
function scenarioCalc(rr, opts){
  opts = opts || {};
  const price = opts.price!==undefined? opts.price : rr.priceNI;
  const overheadAmt = opts.overhead!==undefined? opts.overhead : rr.effectiveOverheadAnnual;
  const units = opts.units!==undefined? opts.units : rr.units;
  if(price===null || rr.directPerUnit===null) return null;
  const contribution = price - rr.directPerUnit;
  let breakEven = null, annualContribution = null, surplus = null;
  if(contribution>0){
    breakEven = Math.ceil(overheadAmt/contribution);
    annualContribution = contribution*units;
    surplus = units - breakEven;
  }
  return {price, overhead:overheadAmt, units, contribution, breakEven, annualContribution, surplus};
}

    const gh = e.target.closest('button[data-grouptoggle]');
    if(gh){ gh.parentElement.classList.toggle('open'); return; }
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    document.querySelectorAll('nav.tabs button[data-tab]').forEach(b=>b.classList.toggle('active', b===btn));
    document.querySelectorAll('.tabpanel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+btn.dataset.tab));
    const grp = btn.closest('.navgroup'); if(grp) grp.classList.add('open');
    const pt = document.getElementById('pageTitle');
    if(pt) pt.textContent = btn.textContent.replace(/^\d+\s*/,'');
    window.scrollTo({top:0});
  });
}

function sensTableRowsHTML(p, type){
  return SENS_PCTS.map((pct,i)=>{
    const label = (pct>0?'+':'') + pct + '%';
    const baseStyle = pct===0? ' style="font-weight:700; background:var(--blush2);"':'';
    if(type==='overhead'){
      return `<tr${baseStyle}><td>${label}</td><td id="sens-${p.key}-oh-${i}-overhead"></td><td id="sens-${p.key}-oh-${i}-breakeven"></td><td id="sens-${p.key}-oh-${i}-surplus"></td></tr>`;
    } else if(type==='price'){
      return `<tr${baseStyle}><td>${label}</td><td id="sens-${p.key}-pr-${i}-price"></td><td id="sens-${p.key}-pr-${i}-contribution"></td><td id="sens-${p.key}-pr-${i}-breakeven"></td><td id="sens-${p.key}-pr-${i}-surplus"></td></tr>`;
    } else {
      return `<tr${baseStyle}><td>${label}</td><td id="sens-${p.key}-vol-${i}-units"></td><td id="sens-${p.key}-vol-${i}-contribution"></td><td id="sens-${p.key}-vol-${i}-surplus"></td></tr>`;

  }).join('');
}

      volCells += `<td><input type="number" step="1" min="0" style="width:52px; text-align:right; padding:4px 5px;" data-action="fcvolni" data-product="${p.key}" data-month="${i}" value="${(p.fcVolumesNI&&p.fcVolumesNI[i])||0}"></td>`;

          <td><input type="number" step="1" min="0" style="width:100%;" data-action="nimarketfield" data-product="nursinghomes" data-field="freq" value="${esc(niMarketSizing.nursinghomes.freq)}"></td>

        return `
        <div class="qcard">

        <tr><td>Contribution / sale (£)</td><td id="ni-contrib-nursinghomes">—</td><td id="ni-contrib-patientgroups">—</td></tr>
      </tbody>

    <h4>NI 12-month volume &amp; forecast</h4>

    <div class="summary-table">
    <table>
      <thead><tr><th>Service</th><th>Market</th><th>Cost floor</th><th>Current price</th><th>Competitor range</th><th>Going rate</th><th>Value position</th><th>Decision</th><th>Final price</th><th>Margin @ final</th><th>Status</th></tr></thead>

            <td id="fps-${p.key}-${mkt}-margin"></td>
            <td id="fps-${p.key}-${mkt}-status"></td>
          </tr>`).join('')).join('')}
      </tbody>
    </table>
    </div>
    <div class="note">ROI margin strips VAT out of the price using each service's basis and rate, then compares to the cost floor. NI margin is indicative — it compares the NI price to the same (euro) cost floor, so confirm the real NI cost base and VAT separately. "Value position" is the differentiation you recorded on the Competitors tab — the third leg alongside cost and competitors. "Status" is the Agreed/Draft sign-off from each service's own tab.</div>
  </div>
  <div class="card">
    <h2>Impact of the decision — price × volume (ROI)</h2>
    <p class="sub">A price change only pays off if the volume holds. Using your ROI units/year and ex-VAT contribution (price − direct cost), this shows what each final price does to the whole, not just per unit. "Volume headroom" is how much sales volume you could lose at the new price and still match today's total contribution — for a price cut it flips to the volume growth you'd need just to stand still.</p>
    <div class="summary-table">
    <table>
      <thead><tr><th>Service</th><th>Units/yr</th><th>Contribution/unit now</th><th>Annual contribution now</th><th>Final price</th><th>Contribution/unit @ final</th><th>Annual contribution @ final</th><th>Change</th><th>Volume headroom</th></tr></thead>

      </tbody>
    </table>
    </div>
    <div class="note">Contribution is ex-VAT price minus direct cost per unit (not the full floor), so it's the cash each sale puts toward overhead — the right basis for a volume decision. Headroom assumes volume is the only thing that moves; it's a guide to how much room a price rise gives you, not a demand forecast.</div>
  </div>`;
}

    </div>

      <div class="stat"><div class="lbl">Sessions planned (12 months)</div><div class="val" id="wf-planned">—</div></div>

      <div class="fieldrow">
        <div class="field"><label>Leads / month</label><input type="number" step="1" min="0" class="money-input" style="width:100%;" data-action="fcleads" data-product="${p.key}" value="${p.fcLeadsPerMonth||0}"></div>

        <tr><td style="white-space:nowrap;">Contribution</td>${months.map((m,i)=>`<td id="fcco-con-${i}" style="text-align:right; font-size:11.5px;"></td>`).join('')}<td id="fcco-con-total" style="text-align:right; font-weight:700;"></td></tr>
        <tr><td style="white-space:nowrap;">Fixed overhead</td>${months.map((m,i)=>`<td id="fcco-oh-${i}" style="text-align:right; font-size:11.5px;"></td>`).join('')}<td id="fcco-oh-total" style="text-align:right; font-weight:700;"></td></tr>
        <tr><td style="font-weight:700; white-space:nowrap;">Net surplus</td>${months.map((m,i)=>`<td id="fcco-sur-${i}" style="text-align:right; font-size:11.5px;"></td>`).join('')}<td id="fcco-sur-total" style="text-align:right;"></td></tr>

      </tbody>
    </table>
    </div>
  </div>`;
  return html;
}

    <p style="font-size:13px; line-height:1.6;">
      <strong>SO1 — Grow ROI income:</strong> grow ROI income by ~€2.4m toward the €4m 2030 ambition. ROI is the known market — costs, prices and routes are solid — so this is a full build: size the market, then the engine from target to delivery.

    <p style="font-size:13px; line-height:1.6; margin-bottom:0;">
      <strong>SO2 — Expand across the border:</strong> sequenced nursing homes first, then patient groups, then existing border relationships. NI is a new, uncertain market, so it validates before it commits — test the assumptions cheaply first; pricing and volume stay provisional until the entry work has reduced the uncertainty.
    </p>
  </div>

  

  <div class="card">
    <h2>New here? How to use this tool</h2>
    <p class="sub">Work left to right through the tabs. Everything you type saves automatically, and it all connects — change a cost or a price early on and every summary updates. You don't need to fill in everything at once.</p>
    <table>
      <thead><tr><th>Step</th><th>Tab</th><th>What you do there, in plain English</th></tr></thead>
      <tbody>
        <tr><td>1</td><td><strong>Overhead</strong></td><td>Put in your real yearly running costs once — rent, wages, insurance, your own time. These are the costs that exist whether or not you make a sale.</td></tr>
        <tr><td>2</td><td><strong>Each route</strong> (Nursing Homes, Patient Groups…)</td><td>Say how much of each overhead that route uses, add its hands-on cost and how many you deliver a year, and enter its price. The tool works out the lowest price that covers its costs (its "cost floor").</td></tr>
        <tr><td>3</td><td><strong>Cost floor summary</strong></td><td>See every service's floor, price and margin side by side — one quick health-check.</td></tr>

        <tr><td style="font-weight:700; white-space:nowrap;">Margin</td><td>Price minus cost floor (with VAT taken out first). The profit built into the price.</td></tr>
        <tr><td style="font-weight:700; white-space:nowrap;">ex-VAT / inc-VAT</td><td>"ex-VAT" is the price before VAT is added; "inc-VAT" is the price with VAT already inside it. VAT isn't yours to keep — you collect it for the taxman — so margins are always judged on the ex-VAT figure.</td></tr>
        <tr><td style="font-weight:700; white-space:nowrap;">Going rate</td><td>The typical price the market/competitors charge — your read on what buyers will pay.</td></tr>
        <tr><td style="font-weight:700; white-space:nowrap;">Value position</td><td>Whether you're deliberately priced above the market (premium), level with it, or below it — and the reason (what makes you worth more, or why you choose to be cheaper).</td></tr>

        <tr><td style="font-weight:700; white-space:nowrap;">Funnel (leads → conversion → sales)</td><td>Leads are enquiries; conversion is the share that become paying customers. Leads × conversion % = expected sales. It's how you sanity-check a volume plan.</td></tr>
      </tbody>
    </table>
  </div>`;
}

function repriceBlockHTML(p, market){
  const isNI = market==='ni';
  const decAction = isNI?'repricedecision':'roirepricedecision';
  const propAction = isNI?'proposedprice':'roiproposedprice';
  const reasonAction = isNI?'repricereason':'roirepricereason';
  const decVal = isNI?(p.repriceDecision||''):(p.roiRepriceDecision||'');
  const propVal = isNI?p.proposedPrice:p.roiProposedPrice;
  const reasonVal = isNI?(p.repriceReason||''):(p.roiRepriceReason||'');
  const sym = isNI?'€':'£';
  return `
  <div class="fieldrow" style="margin-top:12px;">
    <div class="field">
      <label>Reprice based on the above? (${mktLabel(market)})</label>
      <select data-action="${decAction}" data-product="${p.key}">
        <option value="" ${decVal===''?'selected':''}>— choose —</option>
        <option value="hold" ${decVal==='hold'?'selected':''}>Hold — no change</option>
        <option value="raise" ${decVal==='raise'?'selected':''}>Reprice — raise</option>
        <option value="lower" ${decVal==='lower'?'selected':''}>Reprice — lower</option>
        <option value="investigate" ${decVal==='investigate'?'selected':''}>Investigate further</option>
      </select>
    </div>
    <div class="field">
      <label>Proposed ${mktLabel(market)} price (${sym})</label>
      <input type="number" step="0.01" min="0" class="money-input" style="width:100%;" data-action="${propAction}" data-product="${p.key}" value="${propVal===null||propVal===undefined?'':propVal}">
    </div>
    <div class="field" style="flex:2;">
      <label>Reason (from the competitor evidence)</label>
      <input type="text" data-action="${reasonAction}" data-product="${p.key}" value="${esc(reasonVal)}">
    </div>
  </div>
  <div id="out-reprice-${p.key}-${market}"></div>`;
}

function renderCompetitorMarket(prod, market){
  const tbody = document.getElementById(`rows-${prod}-${market}`);
  const table = document.getElementById(`tbl-${prod}-${market}`);
  const emptyNote = document.getElementById(`empty-${prod}-${market}`);
  if(!tbody) return;
  const list = competitorData[prod][market].list;
  tbody.innerHTML = list.map(e=>competitorRowHTML(prod,market,e)).join('');
  if(table) table.style.display = list.length? 'table':'none';
  if(emptyNote) emptyNote.style.display = list.length? 'none':'block';
}
