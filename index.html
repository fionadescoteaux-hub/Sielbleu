const STORAGE_KEY = 'sielbleu_pricing_tool_v1';

function getFullState(){
  return {overhead, overheadLines:OVERHEAD_LINES, overheadLineCounter, products, competitorData, marketValueData, finalPricingData, roiAnswers, checklistState, so1ActionState, accounts, accountIdCounter, contracts, contractIdCounter, marketTargets, competitorIdCounter, exchangeRate, journeyStages, pathwaySteps, pathwayIdCounter, pipeline, pipelineIdCounter,
          niMarketSizing, niPrizeTarget, borderRelationships, borderIdCounter, so2ChecklistState, roiMarketSizing, workforcePlan, personas, personaIdCounter, marketingActivities, activityIdCounter, showNotes: document.getElementById("toggle-notes").checked};
}

function applyState(state){
  if(!state) return;
  // Restore the overhead line definitions first (they may include user-added custom lines),
  // mutating the existing array in place so all closures keep referring to the same list.
  if(state.overheadLines && Array.isArray(state.overheadLines) && state.overheadLines.length){
    OVERHEAD_LINES.length = 0;
    state.overheadLines.forEach(l=>OVERHEAD_LINES.push(l));
  }
  if(state.overheadLineCounter) overheadLineCounter = Math.max(overheadLineCounter, state.overheadLineCounter);
  if(state.exchangeRate!==undefined && state.exchangeRate!==null) exchangeRate = state.exchangeRate;
  if(Array.isArray(state.journeyStages)) journeyStages = state.journeyStages;
  if(Array.isArray(state.pathwaySteps)) pathwaySteps = state.pathwaySteps;
  if(state.pathwayIdCounter) pathwayIdCounter = Math.max(pathwayIdCounter, state.pathwayIdCounter);
  if(Array.isArray(state.pipeline)) pipeline = state.pipeline;
  if(state.pipelineIdCounter) pipelineIdCounter = Math.max(pipelineIdCounter, state.pipelineIdCounter);
  if(state.overhead) Object.assign(overhead, state.overhead);
  if(state.products){
    state.products.forEach(sp=>{
      const existing = findProduct(sp.key);
      if(existing) Object.assign(existing, sp);
    });
  }
  if(state.competitorData){
    // competitorData is now keyed per product; map any legacy per-category keys onto a product.
    const legacyMap = {inpp:'inppassessment', littlebear:'littlebearretail'};
    Object.keys(state.competitorData).forEach(k=>{
      const target = competitorData[k] ? k : legacyMap[k];
      if(target && competitorData[target]) competitorData[target] = state.competitorData[k];
    });
  }
  if(state.marketValueData) Object.assign(marketValueData, state.marketValueData);
  if(state.finalPricingData) Object.assign(finalPricingData, state.finalPricingData);
  if(state.roiAnswers) Object.assign(roiAnswers, state.roiAnswers);
  if(state.checklistState) Object.assign(checklistState, state.checklistState);
  if(state.so1ActionState) Object.assign(so1ActionState, state.so1ActionState);
  if(Array.isArray(state.accounts)) accounts = state.accounts;
  if(state.accountIdCounter) accountIdCounter = Math.max(accountIdCounter, state.accountIdCounter);
  if(Array.isArray(state.contracts)) contracts = state.contracts;
  if(state.contractIdCounter) contractIdCounter = Math.max(contractIdCounter, state.contractIdCounter);
  if(state.marketTargets) Object.assign(marketTargets, state.marketTargets);
  if(state.competitorIdCounter) competitorIdCounter = Math.max(competitorIdCounter, state.competitorIdCounter);
  if(state.niMarketSizing) Object.assign(niMarketSizing, state.niMarketSizing);
  if(state.niPrizeTarget!==undefined && state.niPrizeTarget!==null) niPrizeTarget = state.niPrizeTarget;
  if(Array.isArray(state.borderRelationships)) borderRelationships = state.borderRelationships;
  if(state.borderIdCounter) borderIdCounter = Math.max(borderIdCounter, state.borderIdCounter);
  if(state.showNotes === false){
    document.getElementById('toggle-notes').checked = false;
    document.body.classList.add('hide-notes');
  }
  if(state.roiMarketSizing) Object.assign(roiMarketSizing, state.roiMarketSizing);
  if(state.workforcePlan) Object.assign(workforcePlan, state.workforcePlan);
  if(Array.isArray(state.personas)) personas = state.personas;
  if(state.personaIdCounter) personaIdCounter = Math.max(personaIdCounter, state.personaIdCounter);
  if(Array.isArray(state.marketingActivities)) marketingActivities = state.marketingActivities;
  if(state.activityIdCounter) activityIdCounter = Math.max(activityIdCounter, state.activityIdCounter);
  if(state.so2ChecklistState) Object.assign(so2ChecklistState, state.so2ChecklistState);
  pipeline.forEach(o=>{ if(o.market===undefined) o.market = 'roi'; });
}

function setSaveStatus(text){
  const el = document.getElementById('save-status');
  if(el) el.textContent = text;
}

// ---------- Airtable sync (durable, survives browser clear / different device) ----------
// Talks only to our own Netlify function, which holds the Airtable key privately.
let _initComplete = false;
const AIRTABLE_ENDPOINT = '/api/airtable';
let airtableSaveTimer = null;
let airtableAvailable = true;

function saveStateToAirtable(){
  if(!airtableAvailable) return;
  if(airtableSaveTimer) clearTimeout(airtableSaveTimer);
  airtableSaveTimer = setTimeout(()=>{
    const payload = JSON.stringify({ state: JSON.stringify(getFullState()) });
    fetch(AIRTABLE_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: payload
    }).then(res=>{
      if(!res.ok) throw new Error('save failed');
      setSaveStatus('Saved to your account at '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
    }).catch(()=>{
      setSaveStatus('Saved on this device — could not reach your account (offline?). It will still be here when you return.');
    });
  }, 1200);
}

function loadStateFromAirtable(){
  return fetch(AIRTABLE_ENDPOINT, { method:'GET' })
    .then(res=>{
      if(!res.ok) throw new Error('load failed');
      return res.json();
    })
    .then(data=>{
      if(data && data.ok && data.state){
        const parsed = JSON.parse(data.state);
        if(parsed && Object.keys(parsed).length>0){
          applyState(parsed);
          setSaveStatus('Loaded your saved work from your account');
          return true;
        }
      }
      return false;
    });
}

function saveStateToLocalStorage(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(getFullState()));
  } catch(e){
    setSaveStatus('Could not save on this device — browser storage may be full or blocked.');
  }
  saveStateToAirtable();
}

function loadStateFromLocalStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ return false; }
    applyState(JSON.parse(raw));
    return true;
  } catch(e){
    return false;
  }
}

function wireDataBar(){
  document.getElementById('toggle-notes').addEventListener('change', function(){
    document.body.classList.toggle('hide-notes', !this.checked);
    if(_initComplete) saveStateToLocalStorage();
  });

  document.getElementById('btn-savenow').addEventListener('click', ()=>{
    if(!airtableAvailable){
      setSaveStatus('Cannot reach your account right now — your work is saved on this device and will sync when you are back online.');
      return;
    }
    setSaveStatus('Saving to your account…');
    fetch(AIRTABLE_ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ state: JSON.stringify(getFullState()) })
    }).then(res=>{
      if(!res.ok) throw new Error('save failed');
      setSaveStatus('Saved to your account at '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
    }).catch(()=>{
      setSaveStatus('Could not save to your account — your work is safe on this device. Try again in a moment.');
    });
  });
  document.getElementById('btn-howto').addEventListener('click', ()=>{
    const navBtn = document.querySelector('nav.tabs button[data-tab="objective"]');
    if(navBtn) navBtn.click();
  });

  document.getElementById('btn-import').addEventListener('click', ()=>{
    document.getElementById('file-import').click();
  });
  document.getElementById('file-import').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = evt=>{
      try{
        applyState(JSON.parse(evt.target.result));
        buildApp();
        updateAll();
        setSaveStatus('Imported '+file.name);
      } catch(err){
        alert('Could not read that file — is it a Siel Bleu calculator backup (.json)?');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('btn-excel').addEventListener('click', ()=>{
    downloadExcel();
  });
}

function downloadExcel(){
  if(typeof XLSX === 'undefined'){
    alert('The Excel library did not load — check your internet connection and try again.');
    return;
  }
  const wb = XLSX.utils.book_new();

  // Overhead
  const ohRows = [['Line item','Amount (€)']];
  OVERHEAD_LINES.forEach(l=> ohRows.push([l.label, overhead[l.key]]));
  ohRows.push(['Annual overhead total', overheadTotal()]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ohRows), 'Overhead');

  // Products
  const prodRows = [['Product','Unit','Direct/unit (€)','Overhead/unit (€)','Cost floor (€)','Price ROI (€)','Gap vs floor (€)','Contribution (€)','Break-even (units)','Profit-target units','Units/yr','Surplus vs break-even','NI price (£)','NI contribution (£)','NI break-even']];
  products.forEach(p=>{
    const r = computeProduct(p);
    prodRows.push([
      p.name, p.unit,
      r.directPerUnit!==null? round2(r.directPerUnit): '',
      r.overheadPerUnit!==null? round2(r.overheadPerUnit): '',
      r.costFloor!==null? round2(r.costFloor): '',
      r.priceNI!==null? r.priceNI: '',
      r.gapNI!==null? round2(r.gapNI): '',
      r.contributionNI!==null? round2(r.contributionNI): '',
      r.breakEvenNI!==null? r.breakEvenNI: '',
      r.profitTargetSalesNI!==null? r.profitTargetSalesNI: '',
      r.units>0? r.units: '',
      r.surplusNI!==null? r.surplusNI: '',
      r.roiPrice!==null? r.roiPrice: '',
      r.contributionROI!==null? round2(r.contributionROI): '',
      r.breakEvenROI!==null? r.breakEvenROI: ''
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(prodRows), 'Services');

  // Portfolio roll-up
  const pfRows = [['Product','Units/yr','Contribution/sale (€)','Annual contribution (€)','Overhead share annual (€)','Covers own overhead?']];
  let pfTotalContribution = 0, pfTotalOverhead = 0;
  products.forEach(p=>{
    const r = computeProduct(p);
    const annualContribution = (r.contributionNI!==null && r.units>0) ? r.contributionNI*r.units : null;
    if(annualContribution!==null) pfTotalContribution += annualContribution;
    pfTotalOverhead += r.effectiveOverheadAnnual;
    pfRows.push([
      p.name, r.units>0?r.units:'', r.contributionNI!==null?round2(r.contributionNI):'',
      annualContribution!==null?round2(annualContribution):'', round2(r.effectiveOverheadAnnual),
      annualContribution===null? 'No data yet' : (annualContribution>=r.effectiveOverheadAnnual? 'Yes':'Short')
    ]);
  });
  pfRows.push(['PORTFOLIO TOTAL','','', round2(pfTotalContribution), round2(pfTotalOverhead), pfTotalContribution>=pfTotalOverhead?'Covered':'Short']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pfRows), 'Portfolio');

  // Step C final pricing
  const stepCRows = [['Product','Market','Final price','Reason']];
  FINAL_PRICING_ROWS.forEach(r=>{
    const d = finalPricingData[r.key];
    stepCRows.push([r.product, r.market, d.price, d.reason]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(stepCRows), 'Step C - Final pricing');

  // Step A competitors + repricing (per product, per market)
  const compRows = [['Product','Market','Going rate','Type','Who','What they offer','Price','Source/note','Value position','Value note','Reprice?','Proposed price','Reason']];
  const decLabels = {hold:'Hold', raise:'Raise', lower:'Lower', investigate:'Investigate'};
  const valLabelsX = {premium:'Premium', match:'At market', value:'Value (below)'};
  products.forEach(p=>{
    ['ni','roi'].forEach(market=>{
      const d = competitorData[p.key][market];
      const dec = market==='ni'? p.repriceDecision : p.roiRepriceDecision;
      const prop = market==='ni'? p.proposedPrice : p.roiProposedPrice;
      const reason = market==='ni'? p.repriceReason : p.roiRepriceReason;
      const vp = (p.value && p.value[market])? p.value[market] : {position:'',note:''};
      const decCells = [valLabelsX[vp.position]||'', vp.note||'', decLabels[dec]||'', (prop===null||prop===undefined||prop==='')?'':prop, reason||''];
      if(d.list.length===0){
        compRows.push([p.name, mktLabel(market), d.goingRate, '', '', '', '', '', ...decCells]);
      } else {
        d.list.forEach((entry,i)=>{
          compRows.push([p.name, mktLabel(market), i===0? d.goingRate:'', entry.type, entry.name, entry.offer||'', entry.price, entry.source||'', ...(i===0?decCells:['','','','',''])]);
        });
      }
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(compRows), 'Step A - Competitors');

  // Step B markets and value
  const valRows = [['Category','Market segments to develop','Value proposition']];
  CATEGORIES.forEach(c=>{
    const d = marketValueData[c.key];
    valRows.push([c.name, d.segments, d.valueProp]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(valRows), 'Step B - Value props');

  // VAT & reconciliation
  const decisionLabels = {hold:'Hold', raise:'Raise', lower:'Lower', investigate:'Investigate'};
  const reconRows = [['Product','Cost floor','Current price','Basis','VAT rate %','True ex-VAT','VAT','Price should be (inc-VAT)','Margin (ex-VAT − floor)','Margin %','Re-price?','Proposed price','Reason','Agreed?']];
  products.forEach(p=>{
    const r = computeProduct(p);
    const basisLbl = r.priceBasis==='inc'? 'inc-VAT':'ex-VAT';
    reconRows.push([
      p.name,
      r.costFloor!==null? round2(r.costFloor):'',
      r.priceNI!==null? r.priceNI:'',
      r.priceNI!==null? basisLbl:'',
      r.vatRate,
      r.trueExVat!==null? round2(r.trueExVat):'',
      r.vatAmount!==null? round2(r.vatAmount):'',
      r.priceIncVat!==null? round2(r.priceIncVat):'',
      r.marginVat!==null? round2(r.marginVat):'',
      r.marginVatPct!==null? round2(r.marginVatPct):'',
      decisionLabels[p.repriceDecision]||'',
      (p.proposedPrice!==null && p.proposedPrice!==undefined && p.proposedPrice!=='')? parseFloat(p.proposedPrice):'',
      p.repriceReason||'',
      p.agreed? 'Agreed':'Draft'
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(reconRows), 'VAT & reconciliation');

  // Objective 2 — 12-month forecast
  const monthHdr = []; for(let i=1;i<=12;i++) monthHdr.push('M'+i);
  const fcMonthlyRev = new Array(12).fill(0), fcMonthlyCon = new Array(12).fill(0);
  let fcDirectLabour = 0;
  products.forEach(p=>{ fcDirectLabour += computeProduct(p).directLabourAnnual||0; });
  const fcFixedOverhead = Math.max(0, overheadTotal() - fcDirectLabour);
  const fcRows = [['Forecast (M1–M12)'], ['Product','Metric', ...monthHdr, 'Total']];
  products.forEach(p=>{
    const r = computeProduct(p);
    const finalNI = (p.proposedPrice!==null && p.proposedPrice!==undefined && p.proposedPrice!=='')? parseFloat(p.proposedPrice) : r.priceNI;
    let exVat = null;
    if(finalNI!==null && finalNI!==undefined) exVat = p.priceBasis==='inc'? finalNI/(1+(parseFloat(p.vatRate)||0)/100) : finalNI;
    const contribUnit = (exVat!==null && r.directPerUnit!==null)? exVat - r.directPerUnit : null;
    const vols = p.fcVolumes.map(v=>parseFloat(v)||0);
    const revs = vols.map(v=> exVat!==null? round2(exVat*v):'');
    const cons = vols.map(v=> contribUnit!==null? round2(contribUnit*v):'');
    vols.forEach((v,m)=>{ if(exVat!==null) fcMonthlyRev[m]+=exVat*v; if(contribUnit!==null) fcMonthlyCon[m]+=contribUnit*v; });
    fcRows.push([p.name,'Units', ...vols, vols.reduce((a,b)=>a+b,0)]);
    fcRows.push(['','Revenue', ...revs, exVat!==null? round2(vols.reduce((a,b)=>a+b,0)*exVat):'']);
    fcRows.push(['','Contribution', ...cons, contribUnit!==null? round2(vols.reduce((a,b)=>a+b,0)*contribUnit):'']);
  });
  fcRows.push([]);
  fcRows.push(['COMPANY','Revenue', ...fcMonthlyRev.map(x=>round2(x)), round2(fcMonthlyRev.reduce((a,b)=>a+b,0))]);
  fcRows.push(['','Contribution', ...fcMonthlyCon.map(x=>round2(x)), round2(fcMonthlyCon.reduce((a,b)=>a+b,0))]);
  fcRows.push(['','Fixed overhead', ...new Array(12).fill(round2(fcFixedOverhead/12)), round2(fcFixedOverhead)]);
  let fcCum=0; const fcSur = fcMonthlyCon.map(c=>{ const s=c-fcFixedOverhead/12; return round2(s); });
  const fcCumArr = fcMonthlyCon.map(c=>{ fcCum += c-fcFixedOverhead/12; return round2(fcCum); });
  fcRows.push(['','Net surplus', ...fcSur, round2(fcMonthlyCon.reduce((a,b)=>a+b,0)-fcFixedOverhead)]);
  fcRows.push(['','Cumulative', ...fcCumArr, '']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(fcRows), 'Forecast');

  // Objective 3 — customer pathway
  const pwRows = [['Customer journey — awareness to advocacy'], ['Stage','What happens','Reaching (/yr)','Conversion from prev','Who owns it','Typical time','Where people drop off']];
  journeyStages.forEach((s,i)=>{
    let conv='';
    if(i>0){ const cp=parseFloat(journeyStages[i-1].count), cc=parseFloat(s.count); if(!isNaN(cp)&&cp>0&&!isNaN(cc)) conv=Math.round(cc/cp*100)+'%'; }
    pwRows.push([s.stage, s.what, (s.count===''||s.count===undefined)?'':s.count, conv, s.owner, s.timing, s.dropoff]);
  });
  pwRows.push([]);
  pwRows.push(['Route pathway — entry route → higher-value route']);
  pwRows.push(['From','To','What moves them to the next step','% move on','Value of a To customer','Extra value per From customer','Notes']);
  pathwaySteps.forEach(s=>{
    const conv=parseFloat(s.convPct), val=parseFloat(s.stepValue);
    const va=(!isNaN(conv)&&!isNaN(val))? round2(conv/100*val):'';
    pwRows.push([s.from, s.to, s.trigger, (s.convPct===''||s.convPct===undefined)?'':s.convPct, (s.stepValue===''||s.stepValue===undefined)?'':s.stepValue, va, s.note]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pwRows), 'Customer pathway');

  // Accounts & contracts (CRM)
  const accRows = [['Account','Type','Geography','Potential (€/yr)','Relationship','Next action','Owner']];
  accounts.forEach(a=>{ accRows.push([a.name,a.type,a.geography,a.potential,a.relationship,a.nextAction,a.owner]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(accRows), 'Accounts');
  const ctrRows = [['Account','Route','Annual value (€)','Renewal','Health','Action']];
  contracts.forEach(c=>{ ctrRows.push([c.account,(findProduct(c.product)||{}).name||c.product||'',c.annualValue,c.renewalDate,c.health,c.action]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ctrRows), 'Contracts');

  // Sales pipeline
  const stageLabels = {}; PIPELINE_STAGES.forEach(s=>stageLabels[s.key]=s.label);
  const plRows = [['Product/service','Prospect','Source','Stage','Value','Probability %','Weighted','Close month','Next step','Owner','Market']];
  pipeline.forEach(o=>{
    const prod = (findProduct(o.product)||{}).name || (o.product==='other'?'Other':o.product||'');
    const val=parseFloat(o.value)||0, prob=parseFloat(o.probability)||0;
    plRows.push([prod, o.name||'', o.source||'', stageLabels[o.stage]||o.stage||'', (o.value===''||o.value===undefined)?'':val, (o.probability===''||o.probability===undefined)?'':prob, round2(val*prob/100), o.closeMonth?('M'+o.closeMonth):'', o.nextAction||'', o.owner||'', (o.market==='ni'?'NI':'ROI')]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(plRows), 'Sales pipeline');

  // SO2 — NI cross-border: market sizing, border relationships, checklist
  const so2Rows = [['SO2 — NI market sizing']];
  so2Rows.push(['Route','65+ population / beds (NI)','Realistic obtainable share %','Sessions/unit/yr','NI price (£)','Implied income (£)']);
  NI_VALIDATED_ROUTES.forEach(key=>{
    const p = findProduct(key); const r = results[key];
    const ms = niMarketSizing[key];
    const pop = parseFloat(ms.population)||0, share = parseFloat(ms.share)||0, freq = parseFloat(ms.freq)||0;
    const niPrice = (r.roiPrice!==null && r.roiPrice!==undefined) ? r.roiPrice : null;
    const implied = niPrice!==null ? round2(pop*share/100*freq*niPrice) : '';
    so2Rows.push([p?p.name:key, ms.population||'', ms.share||'', ms.freq||'', niPrice===null?'':niPrice, implied]);
  });
  so2Rows.push([]);
  so2Rows.push(['NI growth ambition (the prize), £', niPrizeTarget||'']);
  so2Rows.push([]);
  so2Rows.push(['Border relationships (priority three)']);
  so2Rows.push(['Contact','Organisation','Relationship type','Status','Next action']);
  borderRelationships.forEach(b=>{ so2Rows.push([b.contact||'', b.org||'', b.type||'', b.status||'', b.nextAction||'']); });
  so2Rows.push([]);
  so2Rows.push(['M7 NI market-entry pack checklist']);
  SO2_CHECKLIST_ITEMS.forEach(i=>{ so2Rows.push([i.label, so2ChecklistState[i.key]?'Done':'Not yet']); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(so2Rows), 'SO2 - NI cross-border');

  XLSX.writeFile(wb, 'sielbleu-pricing-data-'+new Date().toISOString().slice(0,10)+'.xlsx');
}

function round2(n){ return Math.round(n*100)/100; }

function initApp(){
  buildTabNav();
  buildApp();
  updateAll();
  wireDataBar();

  setSaveStatus('Loading your saved work…');

  loadStateFromAirtable()
    .then(loadedFromAirtable=>{
      if(!loadedFromAirtable){
        const local = loadStateFromLocalStorage();
        setSaveStatus(local ? 'Loaded your last save from this device' : 'No saved work yet — start entering figures');
      }
      buildApp();
      updateAll();
      _initComplete = true;
    })
    .catch(()=>{
      airtableAvailable = false;
      const local = loadStateFromLocalStorage();
      setSaveStatus(local ? 'Loaded your last save from this device (working offline)' : 'No saved work yet — start entering figures');
      buildApp();
      updateAll();
      _initComplete = true;
    });
}

initApp();
